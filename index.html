<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Honor your daily promise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Gowun+Batang:wght@400;700&family=Instrument+Serif:ital@0;1&display=swap">
  <style>
    :root{
      --ground:#fbfaf8; --panel:#ffffff; --sunken:#f4f2ee;
      --ink:#16171a; --ink-2:#5a5c60; --ink-3:#93949a;
      --line:#e7e5e0; --line-soft:#f0eeea;
      --accent:#265a4d; --accent-2:#3d7a6a; --accent-soft:rgba(38,90,77,.13);
      --ok:#2b6152; --mid:#8a6a2f; --bad:#9c453a;
      --sky:#e2ecfb; --sky-2:#cfe0f7; --sky-ink:#1c56a8;
      --font-ui:"IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI",
                "Malgun Gothic", sans-serif;
      --font-say:"Gowun Batang", "Apple SD Gothic Neo", "Malgun Gothic", serif;
      --font-title:"Instrument Serif", "Gowun Batang", Georgia, serif;
    }
    @media (prefers-color-scheme: dark){
      :root:not([data-theme="light"]){
        --ground:#141518; --panel:#191b1e; --sunken:#202327;
        --ink:#eceded; --ink-2:#a8aaae; --ink-3:#74767b;
        --line:#2c2f34; --line-soft:#232629;
        --accent:#5d9b8a; --accent-2:#79b3a2; --accent-soft:rgba(93,155,138,.22);
        --ok:#6fae9c; --mid:#c8a266; --bad:#d98a7e;
        --sky:#22354e; --sky-2:#2c4665; --sky-ink:#9ec7f7;
      }
    }
    :root[data-theme="dark"]{
      --ground:#141518; --panel:#191b1e; --sunken:#202327;
      --ink:#eceded; --ink-2:#a8aaae; --ink-3:#74767b;
      --line:#2c2f34; --line-soft:#232629;
      --accent:#5d9b8a; --accent-2:#79b3a2; --accent-soft:rgba(93,155,138,.22);
      --ok:#6fae9c; --mid:#c8a266; --bad:#d98a7e;
      --sky:#22354e; --sky-2:#2c4665; --sky-ink:#9ec7f7;
    }

    *{box-sizing:border-box}
    body{
      margin:0; background:var(--ground); color:var(--ink);
      font-family:var(--font-ui); font-size:16px; line-height:1.6;
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    }
    .wrap{max-width:1180px; margin:0 auto; padding:22px 24px 64px}
    .wrap[hidden]{display:none}

    /* ---------- 머리말 ---------- */
    header{margin-bottom:16px; display:inline-block; cursor:pointer}
    header:hover h1{color:var(--accent)}
    header:focus-visible{outline:1px solid var(--accent); outline-offset:6px}
    header h1{transition:color .15s}
    h1{
      font-family:var(--font-title); font-weight:400; font-size:1.85rem;
      line-height:1.05; letter-spacing:-.015em; margin:0 0 4px;
      text-wrap:balance;
    }
    .sub{
      margin:0; color:var(--ink-3); font-size:.8rem; font-style:italic;
      letter-spacing:.02em;
    }

    .layout{display:grid; grid-template-columns:minmax(0,1fr); gap:26px; align-items:start}
    .layout > *{min-width:0}
    @media (min-width:900px){
      .layout{grid-template-columns:196px minmax(0,1fr)}
    }

    /* ---------- 달력 ---------- */
    @media (min-width:900px){ .cal-col{position:sticky; top:18px} }
    .cal-head{display:flex; align-items:center; gap:4px; margin-bottom:14px}
    .cal-head .ym{
      flex:1; font-size:.78rem; font-weight:600; letter-spacing:.04em;
      color:var(--ink-2); font-variant-numeric:tabular-nums;
    }
    .nav{
      background:none; border:none; color:var(--ink-3);
      width:22px; height:22px; font-size:.95rem; line-height:1;
      cursor:pointer; flex:none; padding:0; border-radius:4px;
    }
    .nav:hover{color:var(--ink); background:var(--sunken)}
    /* 달 이름 옆, 그 달을 통째로 복습하는 단추 */
    .mrev{
      flex:none; padding:3px 9px; border-radius:99px; border:none;
      background:var(--sunken); color:var(--ink-3);
      font-size:.68rem; font-weight:600; letter-spacing:.02em; white-space:nowrap;
    }
    .mrev:hover:not(:disabled){background:var(--sky); color:var(--sky-ink)}
    .mrev.done{color:var(--ok)}
    .mrev:disabled{opacity:.35}

    /* 맨 앞 한 칸은 주간 복습 버튼 자리 */
    .grid{display:grid; grid-template-columns:19px repeat(7,minmax(0,1fr));
          gap:1px; min-width:0}
    .wk{
      height:27px; padding:0; border:none; background:none; border-radius:4px;
      color:var(--ink-3); font-size:.66rem; line-height:1; cursor:pointer;
    }
    .wk:hover:not(.none){color:var(--accent); background:var(--sunken)}
    .wk.none{opacity:.22; cursor:default}
    .wk.done{color:var(--ok)}
    .cell.blank{visibility:hidden; cursor:default}
    .dow{
      text-align:center; font-size:.6rem; font-weight:600; color:var(--ink-3);
      padding:0 0 7px; min-width:0; letter-spacing:.04em;
    }
    #cal-grid{grid-auto-rows:27px}
    .cell{
      height:27px; min-width:0; padding:0; position:relative;
      border:none; background:none; color:var(--ink-3); cursor:pointer;
      font-size:.74rem; font-variant-numeric:tabular-nums; border-radius:4px;
      display:flex; align-items:center; justify-content:center;
    }
    .cell.has{color:var(--ink-2); font-weight:500}
    .cell:hover{background:var(--sunken); color:var(--ink)}
    /* 문장이 있는 날은 밑줄 한 획으로만 표시합니다. */
    .cell.has::after{
      content:""; position:absolute; bottom:3px; left:50%; margin-left:-5px;
      width:10px; height:1px; background:var(--accent); opacity:.55;
    }
    .cell.today{color:var(--ink); font-weight:600}
    .cell.on{background:var(--ink); color:var(--ground); font-weight:600}
    .cell.on::after{background:var(--ground); opacity:.7}

    /* 자물쇠 화면 */
    .gate{
      position:fixed; inset:0; z-index:60; background:var(--ground);
      display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .gate[hidden]{display:none}
    .gate-box{width:100%; max-width:320px; text-align:left}
    .gate-box h1{
      font-family:var(--font-title); font-weight:400;
      font-size:clamp(1.7rem, 4vw, 2.2rem); line-height:1.1; margin:0 0 6px;
    }
    .gate-sub{margin:0 0 22px; font-size:.84rem; color:var(--ink-3)}
    .gate-box input{
      width:100%; padding:12px 14px; margin-bottom:14px;
      font-family:var(--font-ui); font-size:1.1rem; letter-spacing:.3em;
      color:var(--ink); background:var(--paper);
      border:1px solid var(--line); border-radius:6px;
    }
    .gate-box input:focus{outline:none; border-color:var(--accent)}
    .gate-box .btn-go{width:100%; justify-content:center}
    .gate-msg{margin:12px 0 0; font-size:.8rem; color:var(--bad); min-height:1.2em}

    .scopes{
      margin-top:20px; padding-top:16px; border-top:1px solid var(--line);
      display:flex; flex-direction:column; align-items:flex-start; gap:2px;
    }
    .scopes button{
      background:none; border:none; padding:3px 0; cursor:pointer;
      color:var(--ink-3); font-size:.8rem; text-align:left;
    }
    .scopes[hidden]{display:none}
    .scopes button:hover{color:var(--ink)}
    .scopes button.on{color:var(--ink); font-weight:600}
    .scopes button.on::before{content:"— "; color:var(--accent)}
    .tally{margin-top:16px; font-size:.72rem; color:var(--ink-3);
           font-variant-numeric:tabular-nums; letter-spacing:.02em}

    /* ---------- 노트 ---------- */
    .notes{margin-top:26px}
    .notes[hidden]{display:none}
    .note-head{
      display:flex; align-items:baseline; gap:8px;
      padding-bottom:7px; border-bottom:1px solid var(--line); margin-bottom:12px;
    }
    .note-head h3{
      margin:0; font-size:.8rem; font-weight:600; letter-spacing:.04em; color:var(--ink);
    }
    .note-head .day{font-size:.74rem; color:var(--ink-3);
                    font-variant-numeric:tabular-nums}
    .note-head .grow{flex:1}
    li.note-sep{
      border:none; padding:18px 0 4px; font-size:.66rem; font-weight:600;
      letter-spacing:.09em; color:var(--ink-3); text-transform:uppercase;
    }
    .note-head .n{font-size:.72rem; color:var(--ink-3);
                  font-variant-numeric:tabular-nums}

    /* 표에 바로 써 내려갑니다 */

    .note-grid{
      border:1px solid var(--line); border-radius:6px; overflow:hidden;
      background:var(--panel);
    }
    .nrow{display:grid; grid-template-columns:62px minmax(0,1fr) minmax(0,1fr);
          border-bottom:1px solid var(--line-soft)}
    .nrow:last-child{border-bottom:none}
    .nrow.head span{
      padding:6px 9px; font-size:.63rem; font-weight:600; letter-spacing:.09em;
      color:var(--ink-3); text-transform:uppercase; background:var(--sunken);
    }
    .nrow.head span{border-right:1px solid var(--line-soft)}
    .nrow.head span:last-child{border-right:none}

    /* 줄 손잡이 — 번호, 그리고 마우스를 올리면 넣기·빼기 */
    .nh{
      display:flex; align-items:center; gap:2px; padding:0 4px 0 7px;
      background:var(--sunken); border-right:1px solid var(--line-soft);
    }
    .nh .rn{
      flex:1; font-size:.68rem; font-weight:400; color:var(--ink-3);
      font-variant-numeric:tabular-nums;
    }
    .nh .rb{
      opacity:0; width:17px; height:17px; padding:0; border-radius:4px;
      font-size:.8rem; line-height:1; color:var(--ink-3); background:transparent;
    }
    .nrow:hover .nh .rb{opacity:1}
    .nh .rb:hover{background:var(--line); color:var(--ink)}
    .nrow input{
      width:100%; min-width:0; font:inherit; font-size:.85rem; color:var(--ink);
      border:none; border-radius:0; background:transparent;
      padding:7px 9px; line-height:1.45;
    }
    .nrow input:first-child{border-right:1px solid var(--line-soft)}
    .nrow input:focus{outline:none; background:var(--sunken)}
    .nrow input.sel{background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent)}
    /* 고른 칸을 담아두는 자리. 안 보이지만 여기에 커서가 갑니다. */
    .nclip{
      position:fixed; top:0; left:0; width:1px; height:1px;
      opacity:0; z-index:-1; border:none; padding:0; resize:none;
    }
    .nrow input.nko{font-family:var(--font-say)}

    .note-save{display:flex; align-items:center; gap:12px; margin-top:12px; flex-wrap:wrap}
    .note-save .tip{font-size:.7rem; color:var(--ink-3)}
    .note-save .grow{flex:1}
    .note-save .state{font-size:.74rem; color:var(--ink-3)}
    .note-save .state.dirty{color:var(--mid)}
    .note-save .state.saved{color:var(--ok)}
    /* ---------- 모드 탭 ---------- */
    .modes{display:flex; gap:22px; margin-bottom:12px}
    .mode{
      background:none; border:none; padding:0 0 9px; cursor:pointer;
      font-size:.92rem; color:var(--ink-3); font-weight:500;
      border-bottom:2px solid transparent; border-radius:0;
    }
    .mode:hover{color:var(--ink-2)}
    .mode.on{color:var(--ink); font-weight:600; border-bottom-color:var(--ink)}
    #quiz-panel[hidden], #diary-panel[hidden]{display:none}

    /* ---------- 영어 일기 ---------- */
    .diary-head{
      display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
      padding-bottom:12px; border-bottom:1px solid var(--ink);
    }
    .diary-head h2{
      margin:0; font-family:var(--font-title); font-weight:400;
      font-size:1.5rem; letter-spacing:-.01em;
      font-variant-numeric:tabular-nums;
    }
    .diary-head .dw{font-size:.76rem; color:var(--ink-3)}
    .diary-head .grow{flex:1}
    .diary-head .count{font-size:.74rem; color:var(--ink-3);
                       font-variant-numeric:tabular-nums; letter-spacing:.03em}

    .diary-body{padding-top:22px}
    /* 세 칸을 나란히, 크기도 똑같이 */
    .dgrid{display:flex; flex-direction:column; gap:18px}
    .dcell{display:flex; flex-direction:column; min-width:0}
    .dcell textarea{
      width:100%; height:190px; resize:vertical;
      font-size:.88rem; line-height:1.7; font-family:var(--font-ui);
    }
    .dcell.ko textarea{font-family:var(--font-say); font-size:.9rem}
    .dhead{display:flex; align-items:baseline; gap:10px; margin-bottom:7px}
    .dhead .grow{flex:1}
    .dhead .state{font-size:.72rem; color:var(--ink-3)}
    .dhead .state.dirty{color:var(--mid)}
    .dhead .state.saved{color:var(--ok)}
    .dlabel{
      margin:0 0 7px; font-size:.66rem; font-weight:600;
      letter-spacing:.09em; color:var(--ink-3); text-transform:uppercase;
    }
    .dhead .dlabel{margin:0}
    .dsave{
      display:flex; align-items:center; gap:18px; flex-wrap:wrap;
      margin-top:20px; padding-top:18px; border-top:1px solid var(--line);
    }
    .dsave .grow{flex:1}
    .dsave .state{font-size:.76rem; color:var(--ink-3)}
    .dsave .state.dirty{color:var(--mid)}
    .dsave .state.saved{color:var(--ok)}

    /* ---------- 테스트 머리 ---------- */
    .quiz-head{
      display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
      padding-bottom:9px; border-bottom:1px solid var(--ink);
      font-size:.74rem; color:var(--ink-3);
      font-variant-numeric:tabular-nums; letter-spacing:.03em;
    }
    .quiz-head .where{
      color:var(--ink); font-weight:600; font-size:.8rem; letter-spacing:.01em;
    }
    .quiz-head .grow{flex:1}
    .score b{color:var(--ok); font-weight:600}
    .score i{font-style:normal; color:var(--bad)}
    .bar{height:1px; background:var(--line)}
    .bar > div{height:100%; background:var(--accent); transition:width .25s}

    .msg{margin:0; padding:14px 0 0; font-size:.8rem; min-height:1em}
    .msg:empty{padding:0}
    .msg.err{color:var(--bad)}
    .msg.ok{color:var(--ok)}

    /* ---------- 문제 ---------- */
    .stage{padding:0}
    ul.qlist{list-style:none; margin:0; padding:0}
    li.q{
      display:grid; grid-template-columns:30px minmax(0,1fr);
      padding:12px 0; border-bottom:1px solid var(--line-soft);
    }
    li.q > *{grid-column:2}
    /* 문제 번호 자리의 체크박스 */
    .pick{display:inline-flex; align-items:center; gap:5px; cursor:pointer; user-select:none}
    .pick input{position:absolute; opacity:0; width:0; height:0}
    .pick .box{
      width:13px; height:13px; flex:none; border-radius:3px;
      border:1px solid var(--line); background:var(--panel); position:relative;
    }
    .pick:hover .box{border-color:var(--ink-3)}
    .pick input:checked + .box{background:var(--ink); border-color:var(--ink)}
    .pick input:checked + .box::after{
      content:""; position:absolute; left:4px; top:1px;
      width:4px; height:8px; border:solid var(--ground);
      border-width:0 1.5px 1.5px 0; transform:rotate(42deg);
    }
    .pick input:focus-visible + .box{outline:1px solid var(--accent); outline-offset:2px}
    .pick .num{font-size:.7rem}
    .page-acts .note.dirty{color:var(--mid)}
    .page-acts .note.saved{color:var(--ok)}

    .qn{
      grid-column:1; grid-row:1; align-self:start; padding-top:3px;
      font-size:.7rem; font-weight:600; color:var(--ink-3);
      font-variant-numeric:tabular-nums; letter-spacing:.04em;
    }
    li.q.done .qn{color:var(--accent)}
    .qtop{display:flex; align-items:flex-start; gap:14px}
    .qtop .qko{flex:1; min-width:0}
    .qko.foldable{cursor:pointer}
    .qko.foldable:hover{color:var(--accent)}
    .qsave{
      flex:none; margin-top:2px; padding:2px 0; font-size:.73rem;
      color:var(--ink-3); border-bottom:1px solid transparent;
    }
    .qsave:hover:not(:disabled){color:var(--ink); border-bottom-color:var(--line)}
    .qsave.done{color:var(--ok)}
    .qsave.hist{margin-right:4px}
    .hist-box{
      margin-top:9px; padding:3px 0 3px 12px;
      border-left:2px solid var(--line); font-size:.8rem;
    }
    .hist-box.quiet{color:var(--ink-3)}
    .hrow{display:flex; gap:12px; padding:2px 0; align-items:baseline}
    .hrow .hd{
      flex:none; width:42px; color:var(--ink-3); font-size:.72rem;
      font-variant-numeric:tabular-nums;
    }
    .hrow .hm{flex:1; color:var(--ink-2); word-break:break-word}
    .qko{
      font-family:var(--font-say); font-size:1.11rem; line-height:1.45;
      letter-spacing:-.003em; word-break:keep-all; margin:0; color:var(--ink);
    }
    .qnote{
      font-size:.76rem; color:var(--ink-2); margin:6px 0 0;
      padding:1px 0 1px 12px; border-left:2px solid var(--line); line-height:1.55;
    }

    textarea{
      display:block; width:100%; font:inherit; font-family:var(--font-ui);
      font-size:1rem; line-height:1.6; color:var(--ink);
      background:var(--panel); border:1px solid var(--line); border-radius:6px;
      padding:9px 12px; resize:vertical; min-height:46px;
      transition:border-color .15s;
    }
    textarea:focus{outline:none; border-color:var(--accent)}
    textarea[readonly]{background:var(--sunken); color:var(--ink-2)}
    ::placeholder{color:var(--ink-3)}
    .ans{margin-top:8px}

    .acts{display:flex; align-items:center; gap:16px; margin-top:7px}
    .acts .grow{flex:1}

    button{font:inherit; font-family:var(--font-ui); cursor:pointer;
           border:none; background:none; border-radius:6px}
    button:disabled{opacity:.4; cursor:default}
    button:focus-visible{outline:1px solid var(--accent); outline-offset:3px}

    /* 본 동작 하나만 채웁니다. 나머지는 글자 버튼으로. */
    .btn-go{
      background:var(--ink); color:var(--ground); padding:11px 24px;
      font-size:.86rem; font-weight:600; letter-spacing:.01em;
    }
    .btn-go:hover:not(:disabled){background:var(--accent)}
    .btn-text{
      color:var(--ink-3); font-size:.8rem; padding:2px 0;
      border-bottom:1px solid transparent;
    }
    .btn-text:hover:not(:disabled){color:var(--ink); border-bottom-color:var(--line)}
    .btn-text.lead{color:var(--accent)}
    /* 소리로 듣기 */
    .btn-text.play{color:var(--sky-ink); font-variant-numeric:tabular-nums}
    .btn-text.play:hover{border-bottom-color:var(--sky-ink)}
    .btn-text.play.on{color:var(--bad)}
    .btn-text.lead:hover:not(:disabled){border-bottom-color:var(--accent)}

    /* 힌트 — 색 블록 대신 왼쪽 획 하나 */
    .hintbox{
      margin-top:10px; padding:1px 0 1px 12px;
      border-left:2px solid var(--mid); color:var(--ink-2);
      font-size:.85rem; line-height:1.55;
    }
    .hintbox .tag{
      display:block; font-size:.62rem; font-weight:600; letter-spacing:.09em;
      color:var(--mid); text-transform:uppercase; margin-bottom:3px;
    }

    /* 응용 — 같은 표현으로 다른 문장 써보기 */
    .applybox{
      margin-top:10px; padding:12px 14px; border-radius:10px;
      background:var(--sunken); border-left:2px solid var(--sky-ink);
    }
    .applybox.quiet{color:var(--ink-3); font-size:.8rem; border-left-color:var(--line)}
    .ahead{display:flex; align-items:center; gap:10px; margin-bottom:7px}
    .ahead .grow{flex:1}
    .ahead .tag{
      flex:none; font-size:.62rem; font-weight:600; letter-spacing:.06em;
      color:var(--sky-ink); background:var(--sky);
      padding:2px 7px; border-radius:99px; white-space:nowrap;
    }
    .ahead .apoint{
      font-size:.74rem; color:var(--ink-3); min-width:0;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .ahead .asaved{
      flex:none; font-size:.62rem; color:var(--ink-3);
      background:var(--panel); padding:2px 7px; border-radius:99px;
      white-space:nowrap;
    }
    .ahead .btn-text{font-size:.74rem}

    /* 네모는 문장 왼쪽에, 손가락으로도 누르기 좋게 */
    .aitem{display:flex; align-items:flex-start; gap:11px}
    .abody{flex:1; min-width:0}
    .akeep{flex:none; margin-top:1px; padding:3px}
    .akeep.ghost{width:26px; height:26px}
    .akeep .box{width:20px; height:20px; border-radius:5px}
    .akeep input:checked + .box::after{
      left:6px; top:2px; width:5px; height:11px; border-width:0 2px 2px 0;
    }
    .aitem + .aitem, .aitem.more{
      margin-top:12px; padding-top:12px; border-top:1px solid var(--line);
    }
    .aitem.quiet{color:var(--ink-3); font-size:.8rem}
    .afoot{
      display:flex; align-items:center; gap:14px;
      margin-top:12px; padding-top:10px; border-top:1px solid var(--line);
    }
    .afoot .grow{flex:1}
    .afoot .btn-text{font-size:.78rem}
    .ako{
      margin:0 0 8px; font-family:var(--font-say); font-size:1.02rem;
      line-height:1.5; word-break:keep-all;
    }
    .applybox textarea{background:var(--panel)}
    .applybox .rans{margin-top:10px; border-left-color:var(--sky-ink)}
    .applybox .acts{margin-top:6px}

    /* 답을 펼쳤을 때 고르는 두 버튼 */
    .btn-go.sm{padding:9px 20px; font-size:.82rem}
    .btn-mid{
      padding:9px 18px; font-size:.82rem; font-weight:600;
      color:var(--ink); background:var(--sunken);
      box-shadow:inset 0 0 0 1px var(--line);
    }
    .btn-mid:hover:not(:disabled){background:var(--line)}

    /* 문장 옆에 붙는 지금 상태 */
    .qtop .tag{
      flex:0 0 auto; margin-left:2px;
      font-size:.62rem; font-weight:600; letter-spacing:.06em;
      padding:2px 7px; border-radius:99px; white-space:nowrap;
      color:var(--ink-3); background:var(--sunken);
    }
    .qtop .tag.ok{color:var(--ok); box-shadow:inset 0 0 0 1px var(--ok)}
    .qtop .tag.rv{color:var(--mid); box-shadow:inset 0 0 0 1px var(--mid)}
    .qsave.undo{margin-left:6px; font-size:.7rem}
    li.q.done .qko{color:var(--ink-2)}

    /* 5문제를 스크롤하며 풀어도 채점 버튼은 늘 화면에 붙어 있습니다. */
    .page-acts{
      position:sticky; bottom:0; z-index:5;
      display:flex; align-items:center; gap:20px; flex-wrap:wrap;
      margin-top:6px; padding:13px 0 15px;
      border-top:1px solid var(--ink); background:var(--ground);
    }
    .page-acts::before{
      content:""; position:absolute; left:0; right:0; top:-22px; height:22px;
      background:linear-gradient(to bottom, transparent, var(--ground));
      pointer-events:none;
    }
    .page-acts .grow{flex:1}
    .page-acts .note{font-size:.76rem; color:var(--ink-3);
                     font-variant-numeric:tabular-nums}

    .done-panel{padding:64px 0; text-align:left}
    .done-panel .big{
      font-family:var(--font-title); font-size:2rem; margin-bottom:8px;
      letter-spacing:-.01em;
    }
    .done-panel .line{
      color:var(--ink-3); font-size:.84rem; margin-bottom:26px;
      font-variant-numeric:tabular-nums; letter-spacing:.02em;
    }
    .blank{padding:64px 0; color:var(--ink-3); font-size:.86rem}
    .blank strong{
      display:block; font-family:var(--font-title); font-weight:400;
      color:var(--ink-2); font-size:1.5rem; margin-bottom:8px;
    }

    /* ---------- 문장별 메모장 ---------- */
    .qsave.has{color:var(--sky-ink)}
    .qsave.has::after{content:" ●"; font-size:.5rem; vertical-align:middle}
    .padbox{
      margin-top:10px; padding:10px 12px; border-radius:10px;
      background:var(--panel); box-shadow:inset 0 0 0 1px var(--line);
    }
    .phead{display:flex; align-items:center; gap:10px; margin-bottom:6px}
    .phead .grow{flex:1}
    .phead .tag{
      font-size:.62rem; font-weight:600; letter-spacing:.06em;
      color:var(--ink-3); background:var(--sunken);
      padding:2px 7px; border-radius:99px;
    }
    .phead .state{font-size:.72rem; color:var(--ok)}
    .phead .state.dirty{color:var(--mid)}
    .phead .btn-text{font-size:.74rem}
    textarea.ptext{
      background:var(--ground); font-size:.88rem; line-height:1.65;
    }

    /* ---------- 목소리 고르기 ---------- */
    .vbox{
      position:fixed; inset:0; z-index:55; display:flex;
      align-items:center; justify-content:center; padding:20px;
      background:rgba(18,19,22,.6);
    }
    .vbox[hidden]{display:none}
    .vinner{
      width:100%; max-width:460px; max-height:84vh; overflow-y:auto;
      background:var(--ground); border-radius:12px; padding:16px 18px 18px;
      box-shadow:0 18px 50px rgba(0,0,0,.26);
    }
    .vhead{display:flex; align-items:center; gap:10px; margin-bottom:12px}
    .vhead b{font-size:.92rem}
    .vhead .grow{flex:1}
    .vhead .x{
      border:none; background:none; color:var(--ink-3);
      font-size:1.2rem; line-height:1; padding:0 2px;
    }
    .vgroup{margin-bottom:16px}
    .vlab{
      font-size:.66rem; font-weight:600; letter-spacing:.09em;
      color:var(--ink-3); text-transform:uppercase; margin-bottom:6px;
    }
    .vlab .n{font-weight:400; letter-spacing:0; text-transform:none}
    .vrow{
      display:flex; align-items:center; gap:8px;
      padding:7px 9px; border-radius:8px;
    }
    .vrow + .vrow{margin-top:2px}
    .vrow.on{background:var(--sky)}
    .vrow .grow{flex:1}
    .vuse{
      border:none; background:none; padding:0; text-align:left;
      font-size:.84rem; color:var(--ink-2); min-width:0;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .vrow.on .vuse{color:var(--sky-ink); font-weight:600}
    .vrow .vlang{
      flex:none; font-size:.64rem; color:var(--ink-3);
      font-variant-numeric:tabular-nums;
    }
    .vrow .good{
      flex:none; font-size:.6rem; font-weight:600; color:var(--ok);
      background:var(--sunken); padding:2px 6px; border-radius:99px;
    }
    .vtry{
      flex:none; border:none; border-radius:6px; padding:4px 9px;
      background:var(--sunken); color:var(--ink-2); font-size:.74rem;
    }
    .vtry:hover{background:var(--line); color:var(--ink)}
    .vrow.valt{background:var(--sunken); margin-bottom:6px}
    .vrow.valt.on{background:var(--sky)}
    .vrow.valt.on .vuse{color:var(--sky-ink); font-weight:600}
    .vtip.ontop{
      margin:0 0 16px; padding:0 0 14px; border-top:none;
      border-bottom:1px solid var(--line);
    }
    .vnone{margin:0; font-size:.8rem; color:var(--ink-3)}
    .vtip{
      margin:0; padding-top:12px; border-top:1px solid var(--line);
      font-size:.74rem; line-height:1.6; color:var(--ink-3);
    }

    /* ---------- 주간 복습 팝업 ---------- */
    #modal{
      position:fixed; inset:0; z-index:50; display:flex;
      align-items:center; justify-content:center; padding:24px;
      background:rgba(18,19,22,.66);
    }
    #modal[hidden]{display:none}
    .sheet{
      width:100%; max-width:560px; background:var(--ground);
      border:1px solid var(--line); border-radius:10px;
      box-shadow:0 18px 50px rgba(0,0,0,.22); overflow:hidden;
    }

    /* 카드 한 장씩 넘기는 복습 */
    .sheet.rv{
      max-width:520px; border:none; background:transparent; box-shadow:none;
      overflow:visible;
    }
    .rv-top{display:flex; align-items:center; gap:12px; margin-bottom:14px}
    .rv-scope{
      flex:none; font-size:.76rem; color:#fff; opacity:.7;
      max-width:40%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .rv-n{
      font-size:.78rem; color:#fff; opacity:.85;
      font-variant-numeric:tabular-nums; flex:none;
    }
    .rv-bar{flex:1; height:4px; border-radius:99px; background:rgba(255,255,255,.28)}
    .rv-bar > div{height:100%; border-radius:99px; background:#4c7ef3; transition:width .2s}
    .rv-quit{
      flex:none; font-size:.8rem; color:#fff; opacity:.8;
      background:none; border:none; padding:2px 0;
    }
    .rv-quit:hover{opacity:1}

    /* 원문 / 응용 고르기 */
    .rv-modes{display:flex; gap:2px; flex:none}
    .rv-modes button{
      padding:3px 10px; border:none; border-radius:99px;
      background:transparent; color:#fff; opacity:.55;
      font-size:.74rem; font-weight:600;
    }
    .rv-modes button:hover{opacity:.85}
    .rv-modes button.on{background:rgba(255,255,255,.2); opacity:1}

    /* 몇 번씩 읽을지 고르는 줄 */
    .rv-pick{
      display:flex; align-items:center; gap:8px; flex-wrap:wrap;
      margin-bottom:12px; padding:10px 12px; border-radius:10px;
      background:rgba(255,255,255,.14);
    }
    .rv-pick .lab{font-size:.78rem; color:#fff; opacity:.85; margin-right:4px}
    .rv-pick .grow{flex:1}
    .rv-pick button{
      padding:7px 14px; border:none; border-radius:8px;
      background:var(--panel); color:var(--ink);
      font-size:.84rem; font-weight:700;
    }
    .rv-pick button:hover{background:var(--sky); color:var(--sky-ink)}
    .rv-pick button.plain{
      background:transparent; color:#fff; opacity:.75; font-weight:500;
    }

    .rv-card{
      background:var(--ground); border-radius:14px; padding:26px 24px;
      min-height:230px; display:flex; flex-direction:column; justify-content:center;
      box-shadow:0 10px 30px rgba(0,0,0,.16);
    }
    .rv-head{display:flex; align-items:center; gap:10px; margin-bottom:10px}
    .rv-date{font-size:.76rem; color:var(--ink-3); font-variant-numeric:tabular-nums}
    .rv-head .tag{
      font-size:.62rem; font-weight:600; letter-spacing:.06em;
      padding:2px 7px; border-radius:99px; white-space:nowrap;
      color:var(--ink-3); background:var(--sunken);
    }
    .rv-head .tag.ok{color:var(--ok); box-shadow:inset 0 0 0 1px var(--ok)}
    .rv-head .tag.rv{color:var(--mid); box-shadow:inset 0 0 0 1px var(--mid)}
    .rv-ko{
      margin:0; font-size:1.42rem; font-weight:700; line-height:1.45;
      word-break:keep-all; text-wrap:balance; color:var(--ink);
    }
    .rv-en{
      margin:16px 0 0; padding-top:15px; border-top:1px solid var(--line);
      font-size:1.12rem; line-height:1.55; color:var(--accent);
    }
    .rv-point{
      font-size:.66rem; font-weight:600; letter-spacing:.04em;
      color:var(--sky-ink); background:var(--sky);
      padding:2px 8px; border-radius:99px;
      min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .rv-wait{
      margin:0; font-size:1rem; line-height:1.5; color:var(--ink-3);
      word-break:keep-all;
    }
    .rv-retry{
      margin-top:12px; padding:7px 14px; border:none; border-radius:8px;
      background:var(--sunken); color:var(--ink); font-size:.8rem; font-weight:600;
    }
    .rv-retry:hover{background:var(--line)}
    .rv-from{
      margin:14px 0 0; padding-top:11px; border-top:1px dashed var(--line);
      font-size:.74rem; color:var(--ink-3); word-break:keep-all;
    }
    .rv-memo{
      margin:12px 0 0; padding-left:11px; border-left:2px solid var(--line);
      font-size:.8rem; line-height:1.55; color:var(--ink-2);
    }
    .rv-memo.pad{border-left-color:var(--sky-ink); color:var(--ink)}
    .rv-hint{
      margin:12px 0 0; padding-left:11px; border-left:2px solid var(--mid);
      font-size:.84rem; line-height:1.55; color:var(--ink-2);
    }

    /* 카드와 같은 결로. 검은 덩어리는 눈에 세게 박힙니다. */
    .rv-main{
      display:block; width:100%; margin-top:12px; padding:16px;
      border-radius:12px; border:none;
      background:var(--panel); color:var(--ink);
      box-shadow:0 6px 18px rgba(0,0,0,.13);
      font-size:.95rem; font-weight:700; letter-spacing:.01em;
    }
    .rv-main:hover:not(:disabled){background:var(--sunken)}
    .rv-pair{display:flex; gap:10px}
    .rv-pair .rv-main{flex:1}
    .rv-main.ok{color:var(--sky-ink); background:var(--sky)}
    .rv-main.ok:hover:not(:disabled){background:var(--sky-2); color:var(--sky-ink)}
    .rv-main.rev:hover{background:var(--sunken)}

    /* 앞뒤로 넘기는 건 한 단계 여리게 */
    .rv-nav{display:flex; gap:10px; margin-top:10px}
    .rv-nav button{
      flex:1; padding:13px 16px; border-radius:12px;
      background:transparent; color:#fff;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.34);
      font-size:.9rem; font-weight:500;
    }
    .rv-nav button:hover:not(:disabled){background:rgba(255,255,255,.14)}
    .rv-nav button:disabled{opacity:.3}

    .rv-foot{display:flex; align-items:center; gap:14px; margin-top:13px}
    .rv-foot .grow{flex:1}
    .rv-foot button{
      background:none; border:none; padding:2px 0;
      font-size:.78rem; color:#fff; opacity:.8;
    }
    .rv-foot button:hover:not(:disabled){opacity:1}
    .rv-cnt{font-size:.76rem; color:#fff; opacity:.7;
            font-variant-numeric:tabular-nums}

    .rv-done{
      background:var(--ground); border-radius:14px; padding:34px 24px 22px;
      box-shadow:0 10px 30px rgba(0,0,0,.16); text-align:left;
    }
    .rv-done .big{
      font-family:var(--font-title); font-size:2.6rem; line-height:1;
      margin-bottom:8px; font-variant-numeric:tabular-nums;
    }
    .rv-done .scope{
      font-size:.72rem; font-weight:600; letter-spacing:.06em;
      color:var(--ink-3); margin-bottom:10px;
    }
    .rv-done .line{color:var(--ink-2); font-size:.88rem;
                   font-variant-numeric:tabular-nums}
    .rv-done .prev{margin-top:6px; font-size:.76rem; color:var(--ink-3)}
    .rv-done .rv-main{margin-top:22px; box-shadow:inset 0 0 0 1px var(--line)}
    .rv-done .rv-nav button{color:var(--ink); box-shadow:inset 0 0 0 1px var(--line)}
    .rv-done .rv-nav button:hover{background:var(--sunken)}
    .rv-done .rv-quit{
      display:block; margin:14px auto 0; color:var(--ink-3); opacity:1;
    }
    .sheet-head{
      display:flex; align-items:center; gap:10px;
      padding:14px 18px; border-bottom:1px solid var(--ink);
      font-size:.78rem; color:var(--ink-3);
    }
    .sheet-head b{color:var(--ink); font-size:.86rem; letter-spacing:.01em}
    .sheet-head .wl{margin-left:8px; font-variant-numeric:tabular-nums}
    .sheet-head .grow{flex:1}
    .sheet-head .cnt{font-variant-numeric:tabular-nums}
    .sheet-head .x{
      color:var(--ink-3); font-size:1.2rem; line-height:1; padding:0 2px;
    }
    .sheet-head .x:hover{color:var(--ink)}

    .sheet-body{padding:26px 18px 18px}
    .rq{
      font-family:var(--font-say); font-size:1.3rem; line-height:1.5;
      margin:0 0 4px; word-break:keep-all; text-wrap:balance;
    }
    .rn{font-size:.74rem; color:var(--ink-3); margin:0 0 14px}
    .rq + textarea{margin-top:14px}
    .rans{
      margin-top:14px; padding:2px 0 2px 12px; border-left:2px solid var(--ok);
      font-size:.98rem; color:var(--ink);
    }
    .rans b{
      display:block; font-size:.62rem; font-weight:600; letter-spacing:.09em;
      color:var(--ink-3); text-transform:uppercase; margin-bottom:3px;
    }
    .rans .rh{display:flex; align-items:baseline; gap:12px; margin-bottom:3px}
    .rans .rh b{margin-bottom:0}
    .rans .rh .btn-text{font-size:.7rem}
    .sheet-acts{display:flex; align-items:center; gap:16px; margin-top:16px; flex-wrap:wrap}
    .sheet-acts .grow{flex:1}
    .sheet-acts .cnt{font-size:.74rem; color:var(--ink-3);
                     font-variant-numeric:tabular-nums}
    .sheet-body.done{text-align:left; padding:34px 18px 22px}
    .sheet-body.done .big{
      font-family:var(--font-title); font-size:2.4rem; line-height:1;
      margin-bottom:8px; font-variant-numeric:tabular-nums;
    }
    .sheet-body.done .line{color:var(--ink-2); font-size:.86rem;
                           font-variant-numeric:tabular-nums}
    .sheet-body.done .prev{margin-top:6px; font-size:.76rem; color:var(--ink-3)}

    footer{
      margin-top:44px; padding-top:18px; border-top:1px solid var(--line);
      display:flex; align-items:center; gap:18px; flex-wrap:wrap;
      font-size:.74rem; color:var(--ink-3); letter-spacing:.02em;
    }
    footer .grow{flex:1}
    footer .ai-on{color:var(--ok); font-weight:600}
    .fill-state{font-size:.72rem; color:var(--ink-3)}
    .fill-state.ok{color:var(--ok)}
    .mini{
      background:none; border:none; color:var(--ink-3); padding:2px 0;
      font-size:.74rem; cursor:pointer; border-bottom:1px solid transparent;
    }
    .mini:hover{color:var(--ink); border-bottom-color:var(--line)}

    /* ---------- 손전화 ---------- */
    @media (max-width:640px){
      .wrap{padding:16px 14px 80px}
      header h1{font-size:clamp(1.6rem, 8vw, 2.2rem)}
      .layout{gap:20px}
      /* 달력은 접어두고, 문제부터 보이게 */
      .cal-col{order:2}
      .layout > section{order:1}
      .grid{grid-template-columns:22px repeat(7,minmax(0,1fr))}
      #cal-grid{grid-auto-rows:32px}
      .cell, .wk{height:32px}
      .cell{font-size:.8rem}
      .scopes{flex-direction:row; flex-wrap:wrap; gap:6px 16px}
      .qko{font-size:1.05rem}
      .qtop{flex-wrap:wrap; gap:8px}
      .acts{flex-wrap:wrap; gap:12px}
      .page-acts{gap:12px; padding:11px 0 13px}
      .page-acts .note{width:100%; order:9}
      /* 노트 표: 줄 손잡이를 좁히고 두 칸을 나란히 */
      .nrow{grid-template-columns:38px minmax(0,1fr) minmax(0,1fr)}
      .nh{padding:0 2px 0 4px; gap:0}
      .nh .rn{font-size:.62rem}
      .nh .rb{width:15px; height:15px; font-size:.72rem}
      .nrow input{font-size:.8rem; padding:8px 6px}
      .note-save .tip{width:100%; order:9}
      .dcell textarea{height:150px}
      #modal{padding:12px}
      .sheet{max-height:88vh; overflow-y:auto}
      .sheet.rv{max-height:none; overflow:visible}
      .rv-scope{display:none}
      .rv-ko{font-size:1.24rem}
      /* 원문 / 응용 고르기 */
    .rv-modes{display:flex; gap:2px; flex:none}
    .rv-modes button{
      padding:3px 10px; border:none; border-radius:99px;
      background:transparent; color:#fff; opacity:.55;
      font-size:.74rem; font-weight:600;
    }
    .rv-modes button:hover{opacity:.85}
    .rv-modes button.on{background:rgba(255,255,255,.2); opacity:1}

    .rv-card{min-height:190px; padding:22px 18px}
    }
    /* 손가락으로 쓰는 화면에는 마우스를 올릴 수가 없습니다 */
    @media (hover:none){
      .nh .rb{opacity:1}
    }

    @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
  </style>
</head>
<body>
  <div class="gate" id="gate" hidden>
    <form class="gate-box" id="gate-form">
      <h1>Honor your daily promise</h1>
      <p class="gate-sub">비밀번호를 넣어주세요.</p>
      <input id="gate-pw" type="password" inputmode="numeric"
             autocomplete="current-password" placeholder="● ● ● ● ● ●">
      <button class="btn-go" id="gate-go" type="submit">들어가기</button>
      <p class="gate-msg" id="gate-msg"></p>
    </form>
  </div>

  <div class="wrap" id="wrap" hidden>
    <header id="home" role="button" tabindex="0" title="처음으로">
      <h1>Honor your daily promise</h1>
      <p class="sub">Remember the US business trip, Yeeun.</p>
    </header>

    <div class="layout" id="layout">
      <div class="cal-col">
        <section class="box cal">
          <div class="cal-head">
            <button class="nav" id="prev" title="지난 달">‹</button>
            <span class="ym" id="ym">—</span>
            <button class="mrev" id="month-rev" title="이 달 문장을 통째로 복습">월 복습</button>
            <button class="nav" id="next" title="다음 달">›</button>
          </div>
          <div class="grid" id="dow-row"></div>
          <div class="grid" id="cal-grid"></div>
          <div class="scopes" id="scopes">
            <button data-scope="all">전체</button>
            <button data-scope="today">오늘</button>
            <button data-scope="week">최근 7일</button>
            <button data-scope="review">복습 필요</button>
            <button data-scope="done">암기 완료</button>
          </div>
          <div class="tally" id="tally">—</div>
        </section>
      </div>

      <section>
        <div class="modes" role="tablist">
          <button class="mode on" id="mode-quiz">테스트</button>
          <button class="mode" id="mode-diary">영어 일기</button>
        </div>

        <div id="quiz-panel">
          <div class="quiz-head">
            <span class="where" id="where">—</span>
            <span id="progress"></span>
            <span class="grow"></span>
            <span class="score" id="score"></span>
            <button class="mini" id="restart">다시 섞기</button>
          </div>
          <div class="bar"><div id="bar" style="width:0%"></div></div>
          <div id="stage"></div>
        </div>

        <div id="diary-panel" hidden></div>

        <p class="msg" id="msg"></p>
      </section>

    </div>

    <footer>
      <span id="ai-state">—</span>
      <button class="mini" id="ai-test">AI 연결 확인</button>
      <button class="mini" id="voice-pick">목소리 고르기</button>
      <button class="mini" id="fill-btn">응용 미리 쌓기</button>
      <span class="fill-state" id="fill-state"></span>
      <span class="grow"></span>
      <button class="mini" id="reload">시트에서 다시 읽기</button>
      <button class="mini" id="open-sheet">시트 열기</button>
    </footer>
    <div class="vbox" id="vbox" hidden></div>
    <div id="modal" hidden></div>
  </div>

<script>
  /* 시트를 읽고 쓰는 창구 주소입니다. 이 파일을 어디에 올려두든 여기로 말을 겁니다. */
  window.STUDY_API = 'https://script.google.com/macros/s/AKfycbz_plDVKaKU8FzDwGsc-_byWFNnF0XVSTUfodo8hVb3FtyfVF-fAzUZ3TdEDB454EnT/exec';
</script>

<script>
(function () {
  'use strict';

  var DOW = ['일', '월', '화', '수', '목', '금', '토'];
  var now = new Date();

  var state = {
    token: '',
    items: [], hasKey: false, loading: true,
    y: now.getFullYear(), m: now.getMonth(),
    stale: false,       // 지난번 것을 먼저 띄운 상태
    scope: 'all',       // all | today | week | review | done | date
    selDate: '',
    queue: [],          // 문제 순서 (items 의 인덱스)
    page: 0,            // 몇 번째 묶음
    pageSize: 5,        // 한 화면에 몇 문제

    hints: {},          // items 인덱스 -> {text, level, ai}
    checked: {},        // 되돌리려고 고른 문제
    noteOpen: {},       // 메모를 펼쳐둔 문제

    apply: {},          // items 인덱스 -> 응용 문제 {busy, list, pos, shown, mine}
    revealed: {},       // 답을 펼쳐둔 문제
    marked: {},         // items 인덱스 -> {status}  (이번에 고른 것)
    busy: false,
    focusIx: null,      // 다시 그린 뒤 여기로 커서를 보냅니다
    tab: 'quiz',        // quiz | diary
    diary: {},          // 날짜 -> {text, note}
    diaryFor: null,     // 지금 화면에 띄운 일기 날짜
    diaryDirty: false,
    notes: [],          // 노트 목록
    fill: null,         // 응용 쌓기 상태
    vars: {},           // 한글 -> 쌓아둔 응용들 (미리 받아둡니다)
    padOpen: {},        // 메모장을 펼쳐둔 문장
    padDirty: {},       // 아직 저장 안 한 메모장
    padSaved: {},       // 방금 저장한 메모장
    noteFor: null,      // 지금 표에 띄운 노트 날짜
    noteRows: [],       // 표에 적힌 것 (화면 그대로)
    reviews: [],        // 주간 복습 기록
    history: {},        // 한글 -> [{date, mine}] (펼칠 때 받아옵니다)
    histOpen: {},       // 이력을 펼쳐둔 문제
    tally: { done: 0, review: 0 },
    missed: {}          // 틀린 문제 기억 (한글 기준)
  };

  function $(id) { return document.getElementById(id); }

  /** 마우스로 쓰는 기계인지. 폰이면 false 라서 커서를 함부로 안 옮깁니다. */
  function finePointer() {
    try {
      return window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    } catch (e) { return true; }
  }

  /* ---------- 유틸 ---------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function keyOf(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
  function todayKey() {
    var t = new Date();
    return keyOf(t.getFullYear(), t.getMonth(), t.getDate());
  }
  function daysAgoKey(n) {
    var t = new Date();
    t.setDate(t.getDate() - n);
    return keyOf(t.getFullYear(), t.getMonth(), t.getDate());
  }
  function dateLabel(key) {
    if (!key) return '날짜 없음';
    var p = key.split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return (+p[1]) + '월 ' + (+p[2]) + '일' +
           (isNaN(d.getTime()) ? '' : ' ' + DOW[d.getDay()] + '요일');
  }
  function msg(text, kind) {
    var el = $('msg');
    el.textContent = text || '';
    el.className = 'msg' + (kind ? ' ' + kind : '');
  }
  function errText(e) {
    return (e && e.message) ? e.message : '문제가 생겼어요. 잠시 뒤에 다시 해보세요.';
  }

  /* ---------- 서버 ---------- */
  /*
   * 화면이 어디에 있든(구글이든 다른 곳이든) 아래 창구 하나로만 말을 겁니다.
   * 글 종류를 text/plain 으로 두는 게 중요합니다. 그래야 브라우저가
   * 미리 물어보는 절차 없이 곧장 보냅니다. (앱스 스크립트는 그 절차를 못 받습니다)
   */
  var API = window.STUDY_API || '';

  function serverOk() { return !!API; }

  /*
   * 구글이 가끔 JSON 대신 엉뚱한 쪽지를 보냅니다. 그럴 땐 잠깐 쉬고 다시 묻습니다.
   * 서버에 남기는 일은 같은 값을 덮어쓰는 방식이라, 두 번 가도 문제가 없습니다.
   */
  function post(fn, args, ok, bad, left) {
    if (!API) {
      bad(new Error('서버 주소가 없어요.'));
      return;
    }
    var tries = (left === undefined) ? 2 : left;
    function again() {
      if (tries <= 1) return false;
      setTimeout(function () { post(fn, args, ok, bad, tries - 1); }, 800);
      return true;
    }

    var gaveUp = false;
    var bell = setTimeout(function () {
      gaveUp = true;
      bad(new Error('2분 넘게 답이 없어요. 잠시 뒤에 다시 눌러주세요.'));
    }, 150000);

    fetch(API, {
      method: 'POST',
      cache: 'no-store',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args })
    })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        if (gaveUp) return;
        clearTimeout(bell);
        var res = null;
        try { res = JSON.parse(t); } catch (e) { res = null; }

        if (!res) {                       // JSON 이 아니면 다시 묻습니다
          if (again()) return;
          bad(new Error('구글이 답을 안 주네요. 잠시 뒤에 새로고침해 주세요.'));
          return;
        }
        if (!res.ok) {
          if (/LOCKED/.test(res.error || '')) { lockUp(); return; }
          bad(new Error(res.error || '문제가 생겼어요.'));
          return;
        }
        ok(res.data);
      })
      .catch(function () {
        if (gaveUp) return;
        clearTimeout(bell);
        if (again()) return;
        bad(new Error('연결이 안 돼요. 잠시 뒤에 다시 해보세요.'));
      });
  }

  /** 자물쇠 표를 앞에 붙여서 보냅니다. */
  function call(fn, args, ok, bad) {
    post(fn, [state.token].concat(args), ok, bad);
  }

  /*
   * 지난번에 받아둔 것을 브라우저에 남겨뒀다가 먼저 띄웁니다.
   * 그래서 열자마자 바로 보이고, 시트는 뒤에서 조용히 다시 읽습니다.
   */
  var SNAP = 'study.snap';

  function saveSnap(data) {
    try { localStorage.setItem(SNAP, JSON.stringify(data)); } catch (e) {}
  }
  function loadSnap() {
    try {
      var d = JSON.parse(localStorage.getItem(SNAP) || 'null');
      return (d && d.items && d.items.length) ? d : null;
    } catch (e) { return null; }
  }

  function applyData(data) {
    state.items = (data && data.items) || [];
    state.diary = {};
    ((data && data.diary) || []).forEach(function (e) {
      state.diary[e.date] = { text: e.text, note: e.note, fix: e.fix };
    });
    state.notes = (data && data.notes) || [];
    state.vars = {};
    ((data && data.vars) || []).forEach(function (v) {
      (state.vars[v.of] = state.vars[v.of] || []).push(v);
    });
    state.reviews = (data && data.reviews) || [];
    state.hasKey = !!(data && data.hasKey);
  }

  /** 문장들이 그대로인지 가볍게 견줍니다. */
  function stamp(items) {
    var a = items || [];
    if (!a.length) return '0';
    return a.length + '|' + a[0].korean + '|' + a[a.length - 1].korean;
  }

  function load(quiet) {
    var snap = quiet ? null : loadSnap();
    if (snap) {
      applyData(snap);
      state.loading = false;
      state.stale = true;
      build();
      render();
    } else if (!quiet) {
      state.loading = true;
      render();
    }
    var was = stamp(state.items);

    call('listAll', [], function (data) {
      applyData(data);
      state.loading = false;
      state.stale = false;
      saveSnap(data);
      fillCheck();
      // 문장이 그대로면 풀던 순서를 흔들지 않습니다.
      if (!snap || stamp(state.items) !== was) build();
      render();
    }, function (e) {
      state.loading = false;
      state.stale = false;
      render();
      msg(errText(e), 'err');
    });
  }

  /* ---------- 문제 고르기 ---------- */
  function inScope(it) {
    if (state.scope === 'all') return true;
    if (state.scope === 'today') return it.date === todayKey();
    if (state.scope === 'week') return it.date && it.date >= daysAgoKey(6);
    if (state.scope === 'review') return it.status === '복습 필요';
    if (state.scope === 'done') return it.status === '암기 완료';
    if (state.scope === 'date') return it.date === state.selDate;
    return true;
  }

  /** 같은 문장을 두 번 내지 않으려고 지문을 만듭니다. */
  function fingerOf(it) {
    var ko = String(it.korean || '').replace(/s+/g, '');
    var en = String(it.answer || '').toLowerCase()
               .replace(/[^a-z0-9]+/g, '');
    return ko + '|' + en;
  }

  /** 지금 범위에 드는 문장들. 겹치는 건 하나만 남깁니다. */
  function pickIdx() {
    var out = [], seen = {};
    for (var i = 0; i < state.items.length; i++) {
      var it = state.items[i];
      if (!inScope(it)) continue;
      var k = fingerOf(it);
      if (seen[k]) continue;
      seen[k] = 1;
      out.push(i);
    }
    return out;
  }

  function build() {
    var idx = pickIdx();
    for (var j = idx.length - 1; j > 0; j--) {   // 섞기
      var k = Math.floor(Math.random() * (j + 1));
      var t = idx[j]; idx[j] = idx[k]; idx[k] = t;
    }
    state.queue = idx;
    state.page = 0;
    state.apply = {};
    state.padOpen = {};
    state.padDirty = {};
    state.padSaved = {};
    state.checked = {};
    state.noteOpen = {};
    state.revealed = {};
    state.marked = {};
    state.hints = {};
    state.tally = { done: 0, review: 0 };
  }

  /** 지금 화면에 띄울 문제들 (items 의 인덱스) */
  function pageIdx() {
    var from = state.page * state.pageSize;
    return state.queue.slice(from, from + state.pageSize);
  }


  function scopeLabel() {
    if (state.scope === 'all') return '전체';
    if (state.scope === 'today') return '오늘';
    if (state.scope === 'week') return '최근 7일';
    if (state.scope === 'review') return '복습 필요';
    if (state.scope === 'done') return '암기 완료';
    return dateLabel(state.selDate);
  }

  /* ---------- 달력 ---------- */
  function countByDate() {
    var map = {};
    state.items.forEach(function (r) {
      if (!r.date) return;
      map[r.date] = (map[r.date] || 0) + 1;
    });
    return map;
  }

  function renderCal() {
    // 맨 앞 칸은 '그 주 복습' 자리입니다.
    var head = '<div class="dow"></div>';
    for (var i = 0; i < 7; i++) {
      head += '<div class="dow' + (i === 0 ? ' sun' : '') + '">' + DOW[i] + '</div>';
    }
    $('dow-row').innerHTML = head;
    $('ym').textContent = state.y + '년 ' + (state.m + 1) + '월';

    var mk = monthKeyOf(state.y, state.m);
    var mN = itemsInMonth(mk).length;
    var mDone = lastReviewOf(mk, '월간');
    var mb = $('month-rev');
    if (mb) {
      mb.disabled = !mN;
      mb.className = 'mrev' + (mDone ? ' done' : '');
      mb.textContent = '월 복습';
      mb.title = mN
        ? ((state.m + 1) + '월 ' + mN + '문장을 무작위로 복습합니다' +
           (mDone ? (' · 지난 복습 ' + mDone.logged) : ''))
        : '이 달엔 문장이 없어요';
    }

    var counts = state.tab === 'diary' ? diaryCounts() : countByDate();
    var today = todayKey();

    // 그 달 첫 주의 일요일부터 한 주씩 내려갑니다.
    var cur = new Date(state.y, state.m, 1);
    cur.setDate(cur.getDate() - cur.getDay());
    var endOfMonth = new Date(state.y, state.m + 1, 0);

    var html = '';
    while (cur <= endOfMonth) {
      var wk = keyOf(cur.getFullYear(), cur.getMonth(), cur.getDate());
      var n = itemsInWeek(wk).length;
      var done = lastReviewOf(wk);
      html += '<button class="wk' + (n ? '' : ' none') + (done ? ' done' : '') +
        '" data-week="' + wk + '" title="' +
        (n ? (weekLabel(wk) + ' 복습 (' + n + '문장)') : '이 주엔 문장이 없어요') +
        '">' + (done ? '✓' : '↻') + '</button>';

      for (var i2 = 0; i2 < 7; i2++) {
        var dd = new Date(cur);
        dd.setDate(dd.getDate() + i2);
        if (dd.getMonth() !== state.m) {
          html += '<div class="cell blank"></div>';
          continue;
        }
        var key = keyOf(dd.getFullYear(), dd.getMonth(), dd.getDate());
        var c = counts[key] || 0;
        html += '<button class="cell' + (c ? ' has' : '') +
          (state.tab === 'diary' && key === state.selDate ? ' on' : '') +
          (state.tab !== 'diary' && state.scope === 'date' && key === state.selDate ? ' on' : '') +
          (key === today ? ' today' : '') +
          '" data-day="' + key + '" title="' + (c ? c + '개' : '') + '">' +
          dd.getDate() + '</button>';
      }
      cur.setDate(cur.getDate() + 7);
    }
    $('cal-grid').innerHTML = html;

    var miss = 0;
    for (var mi = 0; mi < state.items.length; mi++) {
      if (state.items[mi].status === '복습 필요') miss++;
    }
    var days = 0;
    for (var dk in state.diary) { if (state.diary.hasOwnProperty(dk)) days++; }
    $('tally').textContent = state.stale
      ? ((state.tab === 'diary' ? ('일기 ' + days + '일치')
                                 : ('시트에 ' + state.items.length + '문장')) + ' · 다시 읽는 중…')
      : state.loading
      ? '불러오는 중…'
      : (state.tab === 'diary'
          ? ('일기 ' + days + '일치')
          : ('시트에 ' + state.items.length + '문장' + (miss ? ' · 복습 필요 ' + miss : '')));
  }
  /* ---------- 영어 일기 ---------- */
  /** 2026-09-05 -> { title: "2026년 9월 5일", dow: "토요일" } */
  function diaryTitle(key) {
    var p = String(key || '').split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return {
      title: (+p[0]) + '년 ' + (+p[1]) + '월 ' + (+p[2]) + '일',
      dow: isNaN(d.getTime()) ? '' : DOW[d.getDay()] + '요일'
    };
  }

  function diaryOf(d) {
    return state.diary[d] || { text: '', note: '', fix: '' };
  }

  function wordCount(t) {
    var w = String(t || '').trim();
    if (!w) return 0;
    return w.split(/\s+/).length;
  }

  function setDiaryState(kind) {
    var el = $('d-state');
    if (!el) return;
    if (kind === 'dirty') { el.textContent = '저장 안 됨'; el.className = 'state dirty'; }
    else if (kind === 'saved') { el.textContent = '저장했어요'; el.className = 'state saved'; }
    else if (kind === 'saving') { el.textContent = '저장하는 중…'; el.className = 'state'; }
    else { el.textContent = ''; el.className = 'state'; }
  }

  function updateDiaryCount() {
    var el = $('d-count');
    var ta = $('d-text');
    if (el && ta) el.textContent = wordCount(ta.value) + ' 단어';
  }

  /** 칸 머리줄: 이름 + 저장 버튼 + 저장 상태 */
  function dHead(label, key) {
    return '<div class="dhead">' +
      '<span class="dlabel">' + esc(label) + '</span>' +
      '<span class="grow"></span>' +
      '<span class="state" id="ds-' + key + '"></span>' +
      '<button class="qsave" data-dsave="' + key + '">저장</button>' +
      '</div>';
  }

  function renderDiary(force) {
    var d = state.selDate || todayKey();
    var el = $('diary-panel');

    // 쓰는 중에 다시 그리면 커서가 날아갑니다. 날짜가 바뀔 때만 새로 그립니다.
    if (!force && state.diaryFor === d && el.firstChild) {
      updateDiaryCount();
      return;
    }
    state.diaryFor = d;
    state.diaryDirty = false;
    state.noteFor = null;    // 노트 표도 함께 새로 그립니다

    var p = diaryTitle(d);
    var entry = diaryOf(d);

    el.innerHTML =
      '<div class="diary-head">' +
        '<h2>' + esc(p.title) + '</h2>' +
        '<span class="dw">' + esc(p.dow) + '</span>' +
        '<span class="grow"></span>' +
        '<span class="count" id="d-count">0 단어</span>' +
      '</div>' +
      '<div class="diary-body">' +
        '<div class="dgrid">' +
          '<div class="dcell">' +
            dHead('영어 일기 작문', 'text') +
            '<textarea id="d-text" ' +
            'placeholder="오늘 하루를 영어로 적어보세요. 틀려도 괜찮습니다.">' +
            esc(entry.text) + '</textarea>' +
          '</div>' +
          '<div class="dcell">' +
            dHead('첨삭', 'fix') +
            '<textarea id="d-fix" ' +
            'placeholder="고쳐 쓴 문장, 더 자연스러운 표현">' +
            esc(entry.fix) + '</textarea>' +
          '</div>' +
          '<section class="notes">' +
            '<div class="note-head">' +
              '<h3>노트</h3>' +
              '<span class="day" id="note-day"></span>' +
              '<span class="grow"></span>' +
              '<span class="n" id="note-sel"></span>' +
              '<span class="n" id="note-n"></span>' +
            '</div>' +
            '<div class="note-grid" id="note-grid"></div>' +
            '<textarea class="nclip" id="note-clip" aria-hidden="true"></textarea>' +
            '<div class="note-save">' +
              '<button class="btn-go sm" id="note-save">저장</button>' +
              '<button class="btn-text" id="note-add">칸 추가</button>' +
              '<span class="state" id="note-state"></span>' +
              '<span class="grow"></span>' +
              '<span class="tip">줄 번호에 + × · 끌어서 고르고 Ctrl+C · Ctrl+X · Ctrl+V</span>' +
            '</div>' +
          '</section>' +
          '<div class="dcell ko">' +
            dHead('한글 작문', 'note') +
            '<textarea id="d-note" ' +
            'placeholder="쓰고 싶었던 말을 우리말로 먼저 적어두세요">' +
            esc(entry.note) + '</textarea>' +
          '</div>' +
        '</div>' +
        '<div class="dsave">' +
          '<button class="btn-go" id="d-save">세 칸 모두 저장</button>' +
          '<span class="state" id="d-state"></span>' +
          '<span class="grow"></span>' +
          '<button class="btn-text" id="d-today">오늘로</button>' +
        '</div>' +
      '</div>';

    updateDiaryCount();

    function touched() {
      state.diaryDirty = true;
      setCellState('text'); setCellState('fix'); setCellState('note');
      setDiaryState('dirty');
      updateDiaryCount();
    }
    $('d-text').addEventListener('input', touched);
    $('d-fix').addEventListener('input', touched);
    $('d-note').addEventListener('input', touched);
    $('d-save').addEventListener('click', saveDiaryNow);
    $('d-today').addEventListener('click', function () {
      state.selDate = todayKey();
      var t = new Date();
      state.y = t.getFullYear(); state.m = t.getMonth();
      render();
    });

    $('d-text').addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'Enter')) {
        e.preventDefault();
        saveDiaryNow();
      }
    });
  }

  /** 칸 하나만 저장할 때 그 칸 옆에 알려줍니다. */
  function setCellState(key, kind) {
    var el = key && $('ds-' + key);
    if (!el) return;
    if (kind === 'saving') { el.textContent = '저장하는 중…'; el.className = 'state'; }
    else if (kind === 'saved') { el.textContent = '저장했어요'; el.className = 'state saved'; }
    else if (kind === 'dirty') { el.textContent = '저장 안 됨'; el.className = 'state dirty'; }
    else { el.textContent = ''; el.className = 'state'; }
  }

  /**
   * 일기를 저장합니다.
   * key 를 주면 그 칸만 눌린 것처럼 보여주지만, 시트에는 세 칸이 함께 들어갑니다.
   * (한 줄에 나란히 있는 값이라 따로 떼어 넣을 수 없습니다.)
   */
  function saveDiaryNow(key) {
    var d = state.diaryFor;
    var text = $('d-text') ? $('d-text').value : '';
    var note = $('d-note') ? $('d-note').value : '';
    var fix  = $('d-fix')  ? $('d-fix').value  : '';

    $('d-save').disabled = true;
    if (key) setCellState(key, 'saving'); else setDiaryState('saving');

    call('saveDiary', [d, text, note, fix], function () {
      $('d-save').disabled = false;
      state.diary[d] = { text: text, note: note, fix: fix };
      state.diaryDirty = false;
      setCellState('text'); setCellState('fix'); setCellState('note');
      if (key) { setCellState(key, 'saved'); setDiaryState(); }
      else setDiaryState('saved');
      renderCal();
    }, function (e) {
      $('d-save').disabled = false;
      if (key) setCellState(key, 'dirty'); else setDiaryState('dirty');
      msg(errText(e), 'err');
    });
  }

  function diaryCounts() {
    var map = {};
    for (var d in state.diary) {
      if (!state.diary.hasOwnProperty(d)) continue;
      var e = state.diary[d];
      if ((e.text || '').trim()) map[d] = 1;
    }
    return map;
  }

  /* ---------- 모드 바꾸기 ---------- */
  function setTab(tab) {
    state.tab = tab;
    $('mode-quiz').className = 'mode' + (tab === 'quiz' ? ' on' : '');
    $('mode-diary').className = 'mode' + (tab === 'diary' ? ' on' : '');
    $('quiz-panel').hidden = tab !== 'quiz';
    $('diary-panel').hidden = tab !== 'diary';
    $('scopes').hidden = tab !== 'quiz';
    if (tab === 'diary' && !state.selDate) state.selDate = todayKey();
    msg('');
    render();
    if (tab === 'diary' && finePointer()) {
      var ta = $('d-text');
      if (ta) ta.focus();
    }
  }

  /* ---------- 주간 복습 ---------- */
  // 그 주 일요일 날짜를 '주 열쇠'로 씁니다.
  function weekStartOf(key) {
    var p = String(key || '').split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    d.setDate(d.getDate() - d.getDay());
    return keyOf(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function weekEndOf(wk) {
    var p = wk.split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    d.setDate(d.getDate() + 6);
    return keyOf(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function weekLabel(wk) {
    var a = wk.split('-'), b = weekEndOf(wk).split('-');
    return (+a[1]) + '.' + (+a[2]) + ' – ' + (+b[1]) + '.' + (+b[2]);
  }
  function itemsInWeek(wk) {
    var end = weekEndOf(wk);
    var out = [];
    for (var i = 0; i < state.items.length; i++) {
      var d = state.items[i].date;
      if (d && d >= wk && d <= end) out.push(i);
    }
    return out;
  }
  /** 그 달 1일을 달의 열쇠로 씁니다. */
  function monthKeyOf(y, m) { return keyOf(y, m, 1); }
  function monthLabel(key) {
    var p = String(key || '').split('-');
    return (+p[0]) + '년 ' + (+p[1]) + '월';
  }
  function itemsInMonth(key) {
    var pre = String(key || '').slice(0, 8);   // 2026-09-
    var out = [];
    for (var i = 0; i < state.items.length; i++) {
      var d = state.items[i].date;
      if (d && d.slice(0, 8) === pre) out.push(i);
    }
    return out;
  }

  /** 지난 복습 기록. 주간과 월간은 따로 셉니다. */
  function lastReviewOf(key, kind) {
    var want = kind || '주간';
    for (var i = 0; i < state.reviews.length; i++) {
      var r = state.reviews[i];
      if (r.week === key && (r.kind || '주간') === want) return r;
    }
    return null;
  }

  /* ---------- 복습 창 ---------- */
  /*
   * 카드를 한 장씩 넘기는 방식입니다. 쓰는 칸은 없습니다.
   *   한글 보기 → 정답 확인 → 암기 완료 / 복습 필요 → 다음 장
   * 이전으로 돌아가면 그때 고른 것이 그대로 보입니다.
   */
  var rv = {
    open: false, key: '', kind: '주간', queue: [], pos: 0,
    shown: false, marks: {}, saving: false,
    noteOpen: false, padOpen: false, hint: null, hintBusy: false,
    mode: 'base',   // base = 적어둔 문장 그대로, apply = 응용 문장
    vari: {}       // 자리 -> {busy, ko, en, point, err}
  };

  /** 지금 복습하는 범위 이름 (9.6 – 9.12 / 2026년 9월) */
  function rvScopeLabel() {
    return rv.kind === '월간' ? monthLabel(rv.key) : weekLabel(rv.key);
  }

  // 힌트는 시트에 적어둔 답에서 바로 뽑습니다. 서버에 안 다녀옵니다.
  var RV_STOP = ' a an the i you he she it we they me him her us them my your his its our their is are am was were be been being do does did have has had will would can could should may might to of in on at for with by from as that this these those and or but if so not no ';

  function localHint(ans, lv) {
    var words = String(ans || '').trim().split(/\s+/).filter(Boolean);
    if (!words.length) return '';
    if (lv === 1) {
      var kw = [];
      for (var i = 0; i < words.length; i++) {
        var b = words[i].toLowerCase().replace(/[^a-z']/g, '');
        if (!b || RV_STOP.indexOf(' ' + b + ' ') !== -1) continue;
        if (kw.indexOf(words[i]) === -1) kw.push(words[i]);
        if (kw.length >= 4) break;
      }
      if (!kw.length) kw = words.slice(0, 2);
      return '이런 단어를 써보세요 — ' + kw.join(', ');
    }
    if (lv === 2) {
      var half = Math.max(1, Math.ceil(words.length / 2));
      return words.slice(0, half).join(' ') + ' …';
    }
    return words.join(' ');
  }

  function openReview(key, kind) {
    var scope = (kind === '월간') ? '월간' : '주간';
    var idx = (scope === '월간') ? itemsInMonth(key) : itemsInWeek(key);
    if (!idx.length) {
      msg((scope === '월간' ? monthLabel(key) : weekLabel(key) + ' 주') +
          '에는 문장이 없어요.', 'err');
      return;
    }
    for (var j = idx.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var t = idx[j]; idx[j] = idx[k]; idx[k] = t;
    }
    rv = { open: true, key: key, kind: scope, queue: idx, pos: 0,
           shown: false, marks: {}, saving: false,
           noteOpen: false, padOpen: false, hint: null, hintBusy: false,
           mode: 'base', vari: {} };
    renderReview();
    document.body.style.overflow = 'hidden';
  }

  function closeReview() {
    sayStop();
    auto.on = false;
    keepAwake(false);
    rv.open = false;
    $('modal').hidden = true;
    document.body.style.overflow = '';
  }

  function rvCurrent() {
    if (rv.pos < 0 || rv.pos >= rv.queue.length) return null;
    return state.items[rv.queue[rv.pos]];
  }

  /** 지금까지 고른 것을 셉니다. 되돌아가 다시 골라도 숫자가 맞습니다. */
  function rvTally() {
    var done = 0, review = 0;
    for (var p in rv.marks) {
      if (!rv.marks.hasOwnProperty(p)) continue;
      if (rv.marks[p] === ST_DONE) done++; else review++;
    }
    return { done: done, review: review, all: done + review };
  }

  /** 9월 10일 (목) */
  function rvDate(key) {
    var p = String(key || '').split('-');
    if (p.length < 3) return '';
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return (+p[1]) + '월 ' + (+p[2]) + '일' +
           (isNaN(d.getTime()) ? '' : ' (' + DOW[d.getDay()] + ')');
  }

  function renderReview() {
    var box = $('modal');
    if (!rv.open) { box.hidden = true; return; }
    box.hidden = false;

    if (auto.on) {
      box.innerHTML = autoPanelHtml();
      wire('auto-stop', autoStop);
      wire('auto-x', function () { autoStop(); closeReview(); });
      wire('auto-prev', function () { autoJump(-1); });
      wire('auto-next', function () { autoJump(1); });
      return;
    }

    var total = rv.queue.length;
    var q = rvCurrent();
    var t = rvTally();
    var h = '<div class="sheet rv">';

    if (!q) {
      var past = lastReviewOf(rv.key, rv.kind);
      var rate = total ? Math.round(t.done * 100 / total) : 0;
      h += '<div class="rv-done">' +
        '<div class="scope">' + esc(rv.kind + ' 복습 · ' + rvScopeLabel()) + '</div>' +
        '<div class="big">' + rate + '%</div>' +
        '<div class="line">' + total + '문장 · 암기 완료 ' + t.done +
        ' · 복습 필요 ' + t.review + '</div>' +
        (past ? '<div class="prev">지난 복습 ' + esc(past.logged) + ' · 암기 ' +
                past.right + '/' + past.total + '</div>' : '') +
        '<button class="rv-main" id="rv-save"' + (rv.saving ? ' disabled' : '') + '>' +
        (rv.saving ? '저장하는 중…' : '결과 저장하고 닫기') + '</button>' +
        '<div class="rv-nav">' +
          '<button id="rv-prev">‹ 이전</button>' +
          '<button id="rv-again">다시 풀기</button>' +
        '</div>' +
        '<button class="rv-quit" id="rv-skip">저장 없이 닫기</button>' +
        '</div></div>';
      box.innerHTML = h;
      wire('rv-save', rvSave);
      wire('rv-skip', closeReview);
      wire('rv-again', function () { openReview(rv.key, rv.kind); });
      wire('rv-prev', function () { rvGo(-1); });
      return;
    }

    var mark = rv.marks[rv.pos] || '';
    var pct = Math.round((rv.pos + (rv.shown ? 1 : 0)) * 100 / total);

    var va = (rv.mode === 'apply') ? rv.vari[rv.pos] : null;

    h += '<div class="rv-top">' +
      '<span class="rv-modes">' +
        '<button id="rv-base"' + (rv.mode === 'base' ? ' class="on"' : '') +
        '>원문</button>' +
        '<button id="rv-apply"' + (rv.mode === 'apply' ? ' class="on"' : '') +
        '>응용</button>' +
      '</span>' +
      '<span class="rv-n">' + (rv.pos + 1) + ' / ' + total + '</span>' +
      '<div class="rv-bar"><div style="width:' + pct + '%"></div></div>' +
      '<button class="rv-quit" id="rv-close">그만</button>' +
      '</div>';

    // 응용 모드에서는 AI 가 만든 새 문장을 냅니다.
    var askKo = q.korean, askEn = q.answer, wait = false, oops = '';
    if (rv.mode === 'apply') {
      if (!va || va.busy) { wait = true; }
      else if (va.err) { oops = va.err; }
      else { askKo = va.ko; askEn = va.en; }
    }

    if (rv.askRep) h += repPickHtml();

    h += '<div class="rv-card">' +
      '<div class="rv-head">' +
        '<span class="rv-date">' + esc(rvDate(q.date)) + '</span>' +
        (rv.mode === 'apply' && va && va.point
          ? '<span class="rv-point">' + esc(va.point) + '</span>' : '') +
        (mark ? '<span class="tag ' + (mark === ST_DONE ? 'ok' : 'rv') + '">' +
                esc(mark) + '</span>' : '') +
      '</div>' +
      (wait
        ? '<p class="rv-wait">응용 문장을 만드는 중…</p>'
        : (oops
          ? ('<p class="rv-wait">' + esc(oops) + '</p>' +
             '<button class="rv-retry" id="rv-revar">다시 만들기</button>')
          : ('<p class="rv-ko">' + esc(askKo) + '</p>' +
             (rv.shown
               ? ('<p class="rv-en">' +
                  (askEn ? esc(askEn) : '영어 문장이 비어 있어요') + '</p>')
               : '')))) +
      (rv.mode === 'apply' && !wait && !oops
        ? '<p class="rv-from">원문 — ' + esc(q.korean) + '</p>' : '') +
      (rv.noteOpen && q.note ? '<p class="rv-memo">' + esc(q.note) + '</p>' : '') +
      (rv.padOpen && q.pad
        ? '<p class="rv-memo pad">' + esc(q.pad) + '</p>' : '') +
      (rv.hint && rv.hint.text && !rv.shown
        ? '<p class="rv-hint">' + esc(rv.hint.text) + '</p>' : '') +
      '</div>';

    if (rv.shown) {
      h += '<div class="rv-pair">' +
        '<button class="rv-main ok" id="rv-ok">암기 완료</button>' +
        '<button class="rv-main rev" id="rv-no">복습 필요</button>' +
        '</div>';
    } else {
      h += '<button class="rv-main" id="rv-show"' +
        (wait || oops ? ' disabled' : '') + '>정답 확인</button>';
    }

    h += '<div class="rv-nav">' +
      '<button id="rv-prev"' + (rv.pos === 0 ? ' disabled' : '') + '>‹ 이전</button>' +
      '<button id="rv-next">다음 ›</button>' +
      '</div>';

    h += '<div class="rv-foot">' +
      (rv.shown ? '<button id="rv-hide">답 가리기</button>'
        : ('<button id="rv-hint"' + (rv.hintBusy ? ' disabled' : '') + '>' +
           (rv.hintBusy ? '생각하는 중…'
             : (rv.hint ? (rv.hint.level >= 3 ? '힌트 다시' : '힌트 더') : '힌트')) +
           '</button>' +
           (rv.hint ? '<button id="rv-nohint">힌트 닫기</button>' : ''))) +
      (q.note ? '<button id="rv-note">' + (rv.noteOpen ? '메모 닫기' : '메모') +
                '</button>' : '') +
      (q.pad ? '<button id="rv-pad">' + (rv.padOpen ? '메모장 닫기' : '메모장') +
               '</button>' : '') +
      (say.on ? '<button id="rv-play">' +
        (say.now === 'rv' ? '■ 멈춤' : '▶ 듣기') + '</button>' : '') +
      (say.on ? '<button id="rv-auto">▶▶ 전체 듣기</button>' : '') +
      (rv.mode === 'apply' && !wait
        ? '<button id="rv-revar">다른 문장</button>' : '') +
      '<span class="grow"></span>' +
      '<span class="rv-cnt">암기 ' + t.done + ' · 복습 ' + t.review + '</span>' +
      '</div>';

    box.innerHTML = h + '</div>';

    wire('rv-close', closeReview);
    wire('rv-show', rvShow);
    wire('rv-hide', function () { rv.shown = false; renderReview(); });
    wire('rv-note', function () { rv.noteOpen = !rv.noteOpen; renderReview(); });
    wire('rv-pad', function () { rv.padOpen = !rv.padOpen; renderReview(); });
    wire('rv-play', function () { playFrom('rv'); });
    wire('rv-auto', function () { rv.askRep = !rv.askRep; renderReview(); });
    wire('rv-pick-no', function () { rv.askRep = false; renderReview(); });
    var reps = box.querySelectorAll('[data-rep]');
    for (var r0 = 0; r0 < reps.length; r0++) {
      reps[r0].addEventListener('click', function () {
        autoStart(this.getAttribute('data-rep'));
      });
    }
    wire('rv-hint', rvHint);
    wire('rv-nohint', function () { rv.hint = null; renderReview(); });
    wire('rv-ok', function () { rvMark(true); });
    wire('rv-no', function () { rvMark(false); });
    wire('rv-prev', function () { rvGo(-1); });
    wire('rv-next', function () { rvGo(1); });
    wire('rv-base', function () { rvMode('base'); });
    wire('rv-apply', function () { rvMode('apply'); });
    wire('rv-revar', function () { rvVar(rv.pos, true); });
  }

  /* ---------- 응용편 ---------- */
  function rvMode(m) {
    if (rv.mode === m) return;
    rv.mode = m;
    rv.shown = false;
    rv.hint = null;
    renderReview();
    if (m === 'apply') rvVar(rv.pos);
  }

  /** 그 자리의 응용 문장을 받아옵니다. again 이면 새로 하나 더 뽑습니다. */
  function rvVar(pos, again) {
    if (pos < 0 || pos >= rv.queue.length) return;
    var cur = rv.vari[pos];
    if (cur && cur.busy) return;
    if (cur && !cur.err && !again) return;

    var q = state.items[rv.queue[pos]];
    if (!q) return;

    var seen = (cur && cur.seen) ? cur.seen.slice() : [];
    if (cur && cur.ko && seen.indexOf(cur.ko) === -1) seen.push(cur.ko);

    // 쌓아둔 게 남아 있으면 기다릴 것 없이 바로 띄웁니다.
    var had = state.vars[q.korean] || [];
    for (var i = 0; i < had.length; i++) {
      if (seen.indexOf(had[i].ko) !== -1) continue;
      seen.push(had[i].ko);
      rv.vari[pos] = { busy: false, ko: had[i].ko, en: had[i].en,
                       point: had[i].point, err: '', saved: true, seen: seen };
      if (pos === rv.pos) { rv.shown = false; renderReview(); }
      if (rv.open && rv.mode === 'apply' && pos === rv.pos) rvVar(pos + 1);
      return;
    }

    rv.vari[pos] = { busy: true, ko: '', en: '', point: '', err: '', seen: seen };
    if (pos === rv.pos) { rv.shown = false; renderReview(); }

    call('getVariation', [q.korean, q.answer, q.note, seen, 1], function (res) {
      if (res && res.ok) {
        if (seen.indexOf(res.ko) === -1) seen.push(res.ko);
        rv.vari[pos] = { busy: false, ko: res.ko, en: res.en,
                         point: res.point, err: '', saved: !!res.saved,
                         seen: seen };
      } else {
        rv.vari[pos] = { busy: false, ko: '', en: '', point: '', seen: seen,
          err: (res && res.message) || '응용 문장을 못 만들었어요.' };
      }
      if (rv.open) renderReview();
      // 다음 장을 미리 받아두면 기다림이 줄어듭니다.
      if (rv.open && rv.mode === 'apply' && pos === rv.pos) rvVar(pos + 1);
    }, function (e) {
      rv.vari[pos] = { busy: false, ko: '', en: '', point: '', seen: seen,
                       err: errText(e) };
      if (rv.open) renderReview();
    });
  }

  function rvHint() {
    var q = rvCurrent();
    if (!q) return;
    var lv = rv.hint ? Math.min(3, rv.hint.level + 1) : 1;

    // 응용편에서는 그 응용 문장의 영어로 힌트를 만듭니다.
    var va = (rv.mode === 'apply') ? rv.vari[rv.pos] : null;
    if (rv.mode === 'apply' && (!va || va.busy || va.err)) return;
    var base = va ? va.en : q.answer;

    var local = localHint(base, lv);
    if (local) {
      rv.hint = { text: local, level: lv };
      renderReview();
      return;
    }

    // 답이 비어 있으면 그때만 서버에 물어봅니다.
    rv.hintBusy = true;
    renderReview();
    call('getHint', [va ? va.ko : q.korean, base, '', lv], function (res) {
      rv.hintBusy = false;
      rv.hint = { text: (res && res.text) || '', level: lv };
      renderReview();
    }, function (e) {
      rv.hintBusy = false;
      renderReview();
      msg(errText(e), 'err');
    });
  }

  function rvShow() {
    rv.shown = true;
    renderReview();
  }

  /** 앞뒤로 넘깁니다. 끝을 넘어가면 마무리 화면이 나옵니다. */
  function rvGo(step) {
    var next = rv.pos + step;
    if (next < 0) return;
    if (next > rv.queue.length) next = rv.queue.length;
    sayStop();
    rv.pos = next;
    rv.shown = false;
    rv.noteOpen = false;
    rv.padOpen = false;
    rv.hint = null;
    renderReview();
    if (rv.mode === 'apply') rvVar(rv.pos);
  }

  function rvMark(ok) {
    var q = rvCurrent();
    if (q) {
      var st = ok ? ST_DONE : ST_REVIEW;
      rv.marks[rv.pos] = st;
      q.status = st;
      if (ok) delete state.missed[q.korean];
      else state.missed[q.korean] = true;
    }
    rvGo(1);
  }

  /** 이번에 고른 것을 시트에 한 번에 적습니다. (내 답 칸은 안 건드립니다) */
  function rvPending() {
    var out = [];
    for (var p in rv.marks) {
      if (!rv.marks.hasOwnProperty(p)) continue;
      var it = state.items[rv.queue[p]];
      if (!it) continue;
      out.push({ row: it.row, korean: it.korean, mine: null, status: rv.marks[p] });
    }
    return out;
  }

  function rvMissed() {
    var out = [];
    for (var p in rv.marks) {
      if (!rv.marks.hasOwnProperty(p)) continue;
      if (rv.marks[p] === ST_REVIEW) {
        var it = state.items[rv.queue[p]];
        if (it) out.push(it.korean);
      }
    }
    return out;
  }

  function rvSave() {
    var t = rvTally();
    rv.saving = true;
    renderReview();

    var send = rvPending();
    if (send.length) call('markMany', [send], function () {}, function () {});

    call('saveReview',
      [rv.key, rv.queue.length, t.done, t.review, rvMissed(), rv.kind],
      function (rows) {
        state.reviews = rows || state.reviews;
        rv.saving = false;
        closeReview();
        render();
        msg(rv.kind + ' 복습 결과를 저장했어요.', 'ok');
      },
      function (e) {
        rv.saving = false;
        renderReview();
        msg(errText(e), 'err');
      });
  }

  document.addEventListener('keydown', function (e) {
    if (!rv.open) return;
    if (e.key === 'Escape') { closeReview(); return; }
    if (e.key === 'ArrowLeft') { e.preventDefault(); rvGo(-1); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); rvGo(1); return; }
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (!rv.shown) rvShow();
      return;
    }
    if (rv.shown && (e.key === '1' || e.key === 'o')) { e.preventDefault(); rvMark(true); }
    if (rv.shown && (e.key === '2' || e.key === 'x')) { e.preventDefault(); rvMark(false); }
  });

  /* ---------- 응용 미리 쌓기 ---------- */
  /*
   * 시트에 문장을 적어두면 뒤에서 응용을 2개씩 만들어 쌓아둡니다.
   * 그러면 '응용'을 눌렀을 때 AI 를 안 거치고 바로 뜹니다.
   */
  function fillSay(t, kind) {
    var el = $('fill-state');
    if (!el) return;
    el.textContent = t || '';
    el.className = 'fill-state' + (kind ? ' ' + kind : '');
  }

  function fillCheck() {
    call('fillStatus', [], function (r) {
      if (!r || !r.ok) return;
      state.fill = r;
      if (!r.need) {
        fillSay('응용 다 쌓였어요 (' + r.done + '문장)', 'ok');
      } else {
        fillSay(r.need + '문장은 아직 응용이 없어요' +
          (r.auto ? ' · 10분마다 채우는 중' : ''));
      }
    }, function () {});
  }

  function fillRun() {
    fillSay('지금 채우는 중… 몇 분 걸립니다');
    call('fillNow', [], function (r) {
      if (r && r.ok) {
        msg('응용 ' + r.made + '개를 쌓았어요.' +
            (r.left ? (' 아직 ' + r.left + '문장 남았습니다.') : ''), 'ok');
        load(true);          // 쌓인 것을 바로 들고 옵니다
      } else {
        msg((r && r.message) || '못 채웠어요.', 'err');
      }
      fillCheck();
    }, function (e) {
      fillSay('');
      msg(errText(e), 'err');
    });
  }

  $('fill-btn').addEventListener('click', function () {
    var f = state.fill;
    if (f && !f.auto) {
      var ask = '10분마다 저절로 채우게 할까요? ' +
        '켜두면 시트에 새 문장을 적을 때마다 응용이 알아서 쌓입니다.';
      if (window.confirm(ask)) {
        call('setAutoFill', [true], function () {
          msg('10분마다 저절로 채웁니다.', 'ok');
          fillCheck();
          fillRun();
        }, function (e) { msg(errText(e), 'err'); });
        return;
      }
    }
    fillRun();
  });
  /* ---------- 목소리 고르기 ---------- */
  var VSAMPLE = {
    ko: '오늘 하루도 고생 많으셨어요.',
    en: 'You have been doing really well lately.'
  };

        '<button class="vuse" id="v-alt">' + (altOn() ? '● ' : '○ ') +
        '영어를 남녀 번갈아 읽기</button>' +
        '<span class="grow"></span>' +
      '</div>' +
      '<p class="vtip ontop">목소리가 하나뿐인 기기(대개 폰)에서는 높낮이를 조금 바꿔서 ' +
      '갈라 들려줍니다. 기계음처럼 들리면 꺼주세요.</p>';

    [['ko', '한국어', 'ko-KR'], ['en', '영어', 'en-US']].forEach(function (g) {

      }
      if (list.length === 1) {
        h += '<p class="vnone">이 기기엔 ' + g[1] + ' 목소리가 하나뿐이라 고를 게 없어요.</p>';
      }
      for (var i = 0; i < list.length; i++) {
        var v = list[i];
        var on = pref[g[0]] ? (pref[g[0]] === v.name) : (i === 0);
        h += '<div class="vrow' + (on ? ' on' : '') + '">' +
          '<button class="vuse" data-vuse="' + g[0] + '|' + esc(v.name) + '">' +
          (on ? '● ' : '○ ') + esc(v.name) + '</button>' +
          '<span class="vlang">' + esc(String(v.lang || '').replace('_', '-')) +
