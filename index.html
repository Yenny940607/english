          '<span class="grow"></span>' +
          (voiceScore(v, g[2]) >= 12 ? '<span class="good">또렷함</span>' : '') +
          '<button class="vtry" data-vtry="' + g[2] + '|' + esc(v.name) + '">▶ 들어보기</button>' +
          '</div>';
      }
      h += '</div>';
    });

    var all = say.voices.length;
    return h + '<p class="vtip">이 기기가 알려준 목소리는 모두 ' + all + '개입니다. ' +
      '깔린 것만 나옵니다. 무료로 더 받으실 수 있어요 — ' +
      '<b>아이폰</b> 설정 → 손쉬운 사용 → 말하기 콘텐츠 → 음성 (Enhanced·Premium), ' +
      '<b>안드로이드</b> 설정 → 텍스트 음성 변환 → 음성 데이터 설치, ' +
      '<b>윈도우</b> 설정 → 시간 및 언어 → 음성. ' +
      '받은 뒤 브라우저를 껐다 켜면 목록에 나타납니다.</p>' +
      (all ? '' : '<p class="vnone">아직 목소리를 못 읽었어요. 잠시 뒤 다시 열어보세요.</p>') +
      '</div>';
  }

  function voiceBox(on) {
    var box = $('vbox');
    if (!box) return;
    if (!on) { box.hidden = true; sayStop(); return; }

    loadVoices();
    box.innerHTML = voiceBoxHtml();
    box.hidden = false;

    // 폰에서는 목록이 늦게 옵니다. 들어오면 다시 그립니다.
    if (!say.voices.length) {
      unlockSay();          // 한 번 말을 걸어야 목록을 주는 기기가 있습니다
      var tries = 0;
      var tick = setInterval(function () {
        loadVoices();
        tries++;
        if (say.voices.length || tries > 12) {
          clearInterval(tick);
          if (!$('vbox').hidden) $('vbox').innerHTML = voiceBoxHtml();
        }
      }, 400);
    }
  }

  $('voice-pick').addEventListener('click', function () {
    if (!say.on) { msg('이 브라우저는 읽어주기를 안 해요.', 'err'); return; }
    voiceBox($('vbox').hidden);
  });

  $('vbox').addEventListener('click', function (e) {
    if (!e.target.closest) return;
    var b = e.target.closest('button');
    if (!b) return;

    if (b.id === 'v-close') { voiceBox(false); return; }

    if (b.id === 'v-alt') {
      setAlt(!altOn());
      voiceBox(true);
      msg(altOn() ? '남녀 번갈아 읽습니다.' : '한 목소리로만 읽습니다.', 'ok');
      return;
    }

    var use = b.getAttribute('data-vuse');
    if (use) {
      var p = use.split('|');
      setVoicePref(p[0], p.slice(1).join('|'));
      voiceBox(true);
      msg('목소리를 바꿨어요.', 'ok');
      return;
    }

    var tryIt = b.getAttribute('data-vtry');
    if (tryIt) {
      var q = tryIt.split('|');
      var lang = q[0], name = q.slice(1).join('|');
      unlockSay();
      sayStop();
      var list = voicesFor(lang), v = null;
      for (var i = 0; i < list.length; i++) { if (list[i].name === name) v = list[i]; }
      var u = new window.SpeechSynthesisUtterance(VSAMPLE[lang.slice(0, 2)]);
      u.lang = lang;
      u.rate = (lang.slice(0, 2) === 'en') ? EN_RATE : KO_RATE;
      if (v) u.voice = v;
      try { window.speechSynthesis.speak(u); } catch (err) {}
    }
  });

  /* ---------- 이어 듣기 (운전하면서) ---------- */
  /*
   * 복습 창에 담긴 문장들을 처음부터 끝까지 이어서 읽어줍니다.
   *   1번 한글 → 영어 (고른 횟수만큼) → 2번 한글 → 영어 → …
   * 화면을 안 봐도 되게, 읽는 동안은 화면이 꺼지지 않게 해둡니다.
   */
  var auto = { on: false, i: 0, r: 0, rep: 1, wake: null };

  function keepAwake(on) {
    try {
      if (on) {
        if (navigator.wakeLock && !auto.wake) {
          navigator.wakeLock.request('screen').then(function (w) { auto.wake = w; },
            function () {});
        }
      } else if (auto.wake) {
        auto.wake.release();
        auto.wake = null;
      }
    } catch (e) {}
  }

  function autoCurrent() {
    if (auto.i < 0 || auto.i >= rv.queue.length) return null;
    return state.items[rv.queue[auto.i]];
  }

  function autoStop() {
    auto.on = false;
    sayStop();
    keepAwake(false);
    // 듣다 멈춘 그 문장에 그대로 서 있게 합니다. (1번으로 안 돌아갑니다)
    if (auto.i >= 0 && auto.i < rv.queue.length) {
      rv.pos = auto.i;
      rv.shown = false;
      rv.noteOpen = false;
      rv.padOpen = false;
      rv.hint = null;
    }
    renderReview();
  }

  function autoStart(rep) {
    if (!say.on || !rv.queue.length) return;
    unlockSay();            // 손으로 누른 그 순간에 폰 자물쇠를 풉니다
    sayStop();
    auto.on = true;
    auto.rep = Math.max(1, Math.min(5, Number(rep) || 1));
    auto.i = Math.min(rv.pos, rv.queue.length - 1);
    if (auto.i < 0) auto.i = 0;
    auto.r = 0;
    rv.askRep = false;
    keepAwake(true);
    renderReview();
    setTimeout(autoStep, 120);
  }

  /** 한 문장을 한글 → 영어로 읽고, 다음으로 넘깁니다. */
  /*
   * 한 문장 차례:
   *   한글 1번 (남자, 중저음) → 영어를 고른 횟수만큼 (여자·남자 번갈아)
   * 그러고 다음 문장으로 넘어갑니다.
   */
  function autoStep() {
    if (!auto.on) return;
    var q = autoCurrent();
    if (!q) { autoStop(); return; }

    var pair = askPair(q.korean, q.answer);

    function toNext() {
      setTimeout(function () {
        if (!auto.on) return;
        auto.i++;
        auto.r = 0;
        if (auto.i >= rv.queue.length) { autoStop(); return; }
        renderReview();
        autoStep();
      }, GAP_SET);
    }

    /** 영어를 k 번째로 읽습니다. 처음은 여자, 그다음 남자, 번갈아. */
    function enTurn(k) {
      if (!auto.on) return;
      if (k >= auto.rep) { toNext(); return; }
      auto.r = k;
      renderReview();
      var who = (k % 2 === 0) ? 'f' : 'm';
      var set = speakAs('en-US', who, k);
      sayVoice(pair.en, 'en-US', set.voice, set.rate || EN_RATE, set.pitch, function () {
        if (!auto.on) return;
        setTimeout(function () { enTurn(k + 1); }, GAP_REP);
      });
    }

    auto.r = 0;
    var kset = koSet();
    sayVoice(pair.ko, 'ko-KR', kset.voice, KO_RATE, kset.pitch, function () {
      if (!auto.on) return;
      setTimeout(function () { enTurn(0); }, GAP_MID);
    });
  }

  /** 몇 번씩 읽을지 고르는 줄 */
  function repPickHtml() {
    var h = '<div class="rv-pick">' +
      '<span class="lab">영어를 몇 번씩 읽을까요? (한글은 한 번)</span>';
    for (var k = 1; k <= 5; k++) {
      h += '<button data-rep="' + k + '">' + k + '회</button>';
    }
    return h + '<span class="grow"></span>' +
      '<button class="plain" id="rv-pick-no">취소</button></div>';
  }

  /** 듣는 중 화면 */
  function autoPanelHtml() {
    var q = autoCurrent();
    var total = rv.queue.length;
    return '<div class="sheet rv">' +
      '<div class="rv-top">' +
        '<span class="rv-scope">' + esc(rvScopeLabel()) + '</span>' +
        '<span class="rv-n">' + (auto.i + 1) + ' / ' + total + '</span>' +
        '<div class="rv-bar"><div style="width:' +
          Math.round((auto.i + 1) * 100 / total) + '%"></div></div>' +
        '<button class="rv-quit" id="auto-x">그만</button>' +
      '</div>' +
      '<div class="rv-card">' +
        '<div class="rv-head">' +
          '<span class="rv-date">' + esc(rvDate(q ? q.date : '')) + '</span>' +
          '<span class="rv-point">이어 듣는 중 · 영어 ' +
            (auto.r + 1) + '/' + auto.rep + '</span>' +
        '</div>' +
        '<p class="rv-ko">' + esc(q ? q.korean : '') + '</p>' +
        '<p class="rv-en">' + esc(q ? q.answer : '') + '</p>' +
      '</div>' +
      '<button class="rv-main" id="auto-stop">■ 멈추기</button>' +
      '<div class="rv-nav">' +
        '<button id="auto-prev">‹ 이전 문장</button>' +
        '<button id="auto-next">다음 문장 ›</button>' +
      '</div>' +
      '<div class="rv-foot">' +
        '<span class="grow"></span>' +
        '<span class="rv-cnt">화면이 꺼지지 않게 해뒀어요</span>' +
      '</div>' +
      '</div>';
  }

  function autoJump(step) {
    if (!auto.on) return;
    var n = auto.i + step;
    if (n < 0 || n >= rv.queue.length) return;
    sayStop();
    auto.i = n;
    auto.r = 0;
    renderReview();
    autoStep();
  }

  /* ---------- 테스트 ---------- */
  var ST_REVIEW = '복습 필요';
  var ST_DONE = '암기 완료';

  function statusOf(ix) {
    var m = state.marked[ix];
    if (m) return m;
    return state.items[ix].status || '';
  }

    var q = state.items[ix];

    var h = '<li class="q' + (state.marked[ix] ? ' done' : '') + '">' +
      '<span class="qn">' +
      (st ? '<label class="pick" title="되돌릴 문장 고르기">' +

          : n2) +

        '<p class="qko' + (ap && ap.list.length ? ' foldable' : '') + '"' +
        (ap && ap.list.length
          ? (' data-kofold="' + ix + '" title="눌러서 응용 접기"') : '') +
        '>' + esc(q.korean) + '</p>' +
        (st ? '<span class="tag ' + (st === ST_DONE ? 'ok' : 'rv') + '">' +
              esc(st) + '</span>' +
              '<button class="qsave undo" data-unmark="' + ix + '" ' +
              'title="표시를 지우고 안 한 상태로 되돌립니다">되돌리기</button>' : '') +
        (q.note ? '<button class="qsave" data-note="' + ix + '">' +
                  (state.noteOpen[ix] ? '메모 닫기' : '메모') + '</button>' : '') +
        '<button class="qsave' + (q.pad ? ' has' : '') + '" data-pad="' + ix + '">' +
        (state.padOpen[ix] ? '메모장 닫기' : '메모장') + '</button>' +
        '<button class="qsave hist" data-hist="' + ix + '">' +

      '</div>' +
      (q.note && state.noteOpen[ix] ? '<p class="qnote">' + esc(q.note) + '</p>' : '') +
      (state.histOpen[ix] ? histHtml(q.korean) : '');

    if (hint && hint.text) {
      h += '<div class="hintbox"><span class="tag">힌트 ' + hint.level + '/3' +
           (hint.ai ? '' : ' · 기본') + '</span>' + esc(hint.text) + '</div>';
    }

    if (open) {
      h += '<div class="rans">' +
        '<span class="rh"><b>적어둔 답</b>' +
        '<button class="btn-text" data-hide="' + ix + '">가리기</button></span>' +
        (q.answer ? esc(q.answer) : '시트 영어 칸이 비어 있어요') + '</div>';
    }

    h += padHtml(ix);
    h += applyHtml(ix);

    if (open) {
      h += '<div class="acts">' +
        '<button class="btn-go sm" data-mark="' + ST_DONE + ':' + ix + '">암기 완료</button>' +
        '<button class="btn-mid" data-mark="' + ST_REVIEW + ':' + ix + '">복습 필요</button>' +
        '<span class="grow"></span>' + playBtn('q:' + ix) +
        '</div>';
    } else {
      h += '<div class="acts">' +
        '<button class="btn-text lead" data-hint="' + ix + '"' +
        (state.busy ? ' disabled' : '') + '>' +
        (hint ? (hint.level >= 3 ? '힌트 다시' : '힌트 더') : '힌트') + '</button>' +
        (hint ? '<button class="btn-text" data-nohint="' + ix + '">힌트 닫기</button>' : '') +
        '<button class="btn-text" data-show="' + ix + '">답 보기</button>' +
        playBtn('q:' + ix) +
        '<button class="btn-text" data-apply="' + ix + '"' +
        (ap && ap.busy ? ' disabled' : '') + '>' +
        (ap && ap.busy ? '만드는 중…' : (ap && ap.list.length ? '응용 더' : '응용')) +
        '</button>' +
        (ap && ap.list.length
          ? '<button class="btn-text" data-aclose="' + ix + '">응용 닫기</button>'
          : '') +
        '</div>';
    }
    return h + '</li>';
  }

  /** 이 쪽에서 표시가 붙어 있는 문장들 */
  function markedOnPage() {
    return pageIdx().filter(function (ix) { return !!statusOf(ix); });
  }
  /** 그 중 네모를 친 것들 */
  function pickedOnPage() {
    return markedOnPage().filter(function (ix) { return !!state.checked[ix]; });
  }
  /** 지금 범위 전체에서 표시가 붙어 있는 문장들 */
  function scopeMarkedAll() {
    return state.queue.filter(function (ix) { return !!statusOf(ix); });
  }

  /* ---------- 소리로 듣기 ---------- */
  /*
   * 브라우저에 들어 있는 읽어주기 기능을 씁니다. 서버에 안 다녀옵니다.
   * 한글을 먼저 읽고, 잠깐 쉬었다가 영어를 읽습니다.
   */
  var GAP_MID = 500;    // 한글과 영어 사이
  var GAP_SET = 1000;   // 한 묶음이 끝나고 다음 묶음까지

  var say = {
    on: !!(window.speechSynthesis && window.SpeechSynthesisUtterance),
    voices: [],
    now: '',        // 지금 읽고 있는 자리 (없으면 빈 값)
    stop: false
  };

  function loadVoices() {
    if (!say.on) return;
    try { say.voices = window.speechSynthesis.getVoices() || []; } catch (e) {}
  }
  if (say.on) {
    loadVoices();
    try { window.speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {}
  }

  /*
   * 기기에 깔린 목소리는 품질 차이가 큽니다.
   * 사람 목소리에 가까운 것(Google · Natural · Neural · 온라인)을 먼저 고릅니다.
   * 회원님이 직접 고른 게 있으면 그걸 씁니다.
   */
  var VOICE_STORE = 'study.voice';

  function voicePrefs() {
    try { return JSON.parse(localStorage.getItem(VOICE_STORE) || '{}') || {}; }
    catch (e) { return {}; }
  }
  /** 남녀 번갈아 읽기 (끄면 목소리를 안 비틉니다) */
  function altOn() {
    var p = voicePrefs();
    return p.alt !== false;        // 따로 끄지 않았으면 켜짐
  }
  function setAlt(on) {
    var p = voicePrefs();
    p.alt = !!on;
    try { localStorage.setItem(VOICE_STORE, JSON.stringify(p)); } catch (e) {}
  }

  function setVoicePref(lang, name) {
    var p = voicePrefs();
    if (name) p[lang.slice(0, 2)] = name; else delete p[lang.slice(0, 2)];
    try { localStorage.setItem(VOICE_STORE, JSON.stringify(p)); } catch (e) {}
  }

  /** 사람 같을수록, 그리고 찾는 말씨에 가까울수록 높은 점수 */
  function voiceScore(v, lang) {
    var nm = String(v.name || '').toLowerCase();
    var vl = String(v.lang || '').replace('_', '-');
    var sc = 0;

    // 말씨가 딱 맞는 것(en-US, ko-KR)을 가장 먼저 봅니다.
    if (lang && vl === lang) sc += 10;
    else if (lang && baseLang(vl) === baseLang(lang)) {
      // 영어면 미국식을 먼저, 영국·호주·인도식은 뒤로
      if (/-(GB|AU|IN|IE|ZA|NZ|NG|PH|SG|HK)$/i.test(vl)) sc -= 5;
    }
    // Natural·Neural 이 가장 사람 같습니다. 듣기에 제일 편합니다.
    if (nm.indexOf('natural') !== -1 || nm.indexOf('neural') !== -1) sc += 9;
    if (nm.indexOf('premium') !== -1 || nm.indexOf('enhanced') !== -1) sc += 6;
    if (nm.indexOf('siri') !== -1) sc += 5;
    if (nm.indexOf('google') !== -1) sc += 4;
    if (nm.indexOf('online') !== -1 || nm.indexOf('온라인') !== -1) sc += 3;
    if (nm.indexOf('desktop') !== -1) sc -= 4;      // 윈도우 기본값, 많이 딱딱합니다
    if (nm.indexOf('espeak') !== -1 || nm.indexOf('compact') !== -1) sc -= 6;
    if (v.localService === false) sc += 1;           // 서버에서 만드는 쪽이 대개 낫습니다
    return sc;
  }

  /** 'ko-KR' 에서 말 이름만 (kok-IN 같은 다른 말에 안 걸리게) */
  function baseLang(v) {
    return String(v || '').replace(/_/g, '-').split('-')[0].toLowerCase();
  }

  /** 그 말로 쓸 수 있는 목소리들, 좋은 것부터 */
  function voicesFor(lang) {
    if (!say.voices.length) loadVoices();
    var want = baseLang(lang);
    var out = [];
    for (var i = 0; i < say.voices.length; i++) {
      if (baseLang(say.voices[i].lang) === want) out.push(say.voices[i]);
    }
    out.sort(function (a, b) { return voiceScore(b, lang) - voiceScore(a, lang); });
    return out;
  }

  function pickVoice(lang) {
    var list = voicesFor(lang);
    if (!list.length) return null;
    var want = voicePrefs()[lang.slice(0, 2)];
    if (want) {
      for (var i = 0; i < list.length; i++) {
        if (list[i].name === want) return list[i];
      }
    }
    return list[0];
  }

  /*
   * 폰에서 읽어주기가 막히는 까닭이 몇 가지 있습니다.
   *  - 아이폰은 '손으로 누른 그 순간' 한 번 소리를 내야 그 뒤로 허락해 줍니다.
   *  - cancel() 바로 뒤에 speak() 하면 삼켜지는 일이 있습니다.
   *  - 안드로이드 크롬은 15초쯤 지나면 혼자 멈춥니다.
   * 아래 세 가지로 그걸 피해 갑니다.
   */
  var sayReady = false;     // 아이폰 자물쇠를 푼 적이 있는지
  var sayAlive = null;      // 안드로이드용 깨우기

  /** 손으로 누른 그 순간에 불러야 합니다. */
  function unlockSay() {
    if (!say.on || sayReady) return;
    try {
      var u = new window.SpeechSynthesisUtterance(' ');
      u.volume = 0;
      window.speechSynthesis.speak(u);
      sayReady = true;
    } catch (e) {}
  }

  /** 안드로이드 크롬이 중간에 멈추는 걸 막습니다. */
  function keepSaying(on) {
    if (sayAlive) { clearInterval(sayAlive); sayAlive = null; }
    if (!on) return;
    sayAlive = setInterval(function () {
      try {
        var s = window.speechSynthesis;
        if (!s.speaking) { clearInterval(sayAlive); sayAlive = null; return; }
        s.pause();
        s.resume();
      } catch (e) {}
    }, 9000);
  }

  /*
   * 남자 목소리 / 여자 목소리 가려내기.
   * 기기마다 이름이 다 달라서, 흔한 이름들을 적어두고 맞춰봅니다.
   */
  var V_MALE = ' injoon inJoon guy david ryan mark christopher eric brian andrew ' +
    'roger steffan thomas george daniel alex fred aaron tom james john male 남성 남자 ';
  var V_FEMALE = ' sunhi heami yuna aria zira jenny michelle ana sara emma ava ' +
    'samantha karen moira tessa nicky serena allison female 여성 여자 ';

  /** 'm' 남자 · 'f' 여자 · '' 모르겠음 */
  function genderOf(v) {
    var nm = ' ' + String(v && v.name || '').toLowerCase() + ' ';
    var words = nm.split(/[^a-z가-힣]+/);
    for (var i = 0; i < words.length; i++) {
      var w = words[i];
      if (!w) continue;
      if (V_MALE.toLowerCase().indexOf(' ' + w + ' ') !== -1) return 'm';
      if (V_FEMALE.toLowerCase().indexOf(' ' + w + ' ') !== -1) return 'f';
    }
    return '';
  }

  /**
   * 원하는 성별로 말할 채비를 합니다. { voice, pitch }
   * 폰에는 목소리가 한 가지뿐인 때가 많습니다.
   * 그럴 땐 높낮이를 바꿔서 남자·여자처럼 들리게 만듭니다.
   */
  /*
   * 목소리가 하나뿐인 기기(대개 폰)에서는 회차마다 높낮이와 빠르기를
   * 조금씩 달리해서 같은 소리가 되풀이되지 않게 합니다.
   * 차이를 크게 두면 기계음이 나므로 좁은 폭 안에서만 움직입니다.
   */
  var ALT_CYCLE = [
    { pitch: 1.06, rate: 0.93 },
    { pitch: 0.92, rate: 0.86 },
    { pitch: 1.01, rate: 0.97 },
    { pitch: 0.88, rate: 0.90 },
    { pitch: 1.09, rate: 0.83 }
  ];

  /** k 는 몇 번째로 읽는지 (0부터) */
  function speakAs(lang, want, k) {
    var list = voicesFor(lang);
    var best = list.length ? list[0] : null;

    // 번갈아 읽기를 꺼두셨으면 있는 목소리를 그대로 씁니다.
    if (!altOn()) return { voice: pickVoice(lang), pitch: 1 };

    // 1) 남녀 목소리가 따로 있으면 그걸 씁니다. (컴퓨터) 비틀지 않습니다.
    for (var i = 0; i < list.length; i++) {
      if (genderOf(list[i]) === want) return { voice: list[i], pitch: 1 };
    }

    // 2) 하나뿐이면 회차마다 조금씩 달리 읽습니다. (폰)
    var c = ALT_CYCLE[(Number(k) || 0) % ALT_CYCLE.length];
    return { voice: best, pitch: c.pitch, rate: c.rate };
  }

  /** 예전 이름 (목소리 하나만 필요할 때) */
  function voiceByGender(lang, want) { return speakAs(lang, want).voice; }

  function sayVoice(text, lang, v, rate, pitch, done) {
    var t = String(text || '').trim();
    if (!t) { done(); return; }

    var u = new window.SpeechSynthesisUtterance(t);
    u.lang = lang;
    u.rate = rate || 1;
    if (pitch) u.pitch = pitch;
    if (v) u.voice = v;

    var over = false;
    function once() {
      if (over) return;
      over = true;
      keepSaying(false);
      done();
    }
    u.onend = once;
    u.onerror = once;

    try {
      window.speechSynthesis.speak(u);
      keepSaying(true);
    } catch (e) { once(); }

    setTimeout(function () {
      try {
        var s = window.speechSynthesis;
        if (!over && !s.speaking && !s.pending) once();
      } catch (e) {}
    }, 1200);
  }

  /*
   * 물음표가 없으면 읽어주기가 평서문처럼 쭉 내려 읽습니다.
   * 한쪽에만 물음표가 있으면 다른 쪽에도 붙여서 끝을 올려 읽게 합니다.
   * (시트 글자는 안 건드립니다. 읽을 때만 붙입니다)
   */
  var EN_ASK = /^(do|does|did|are|is|was|were|am|can|could|will|would|shall|should|have|has|had|may|might|who|what|when|where|why|how|which|whose|whom|any|anyone|anybody)\b/i;
  var KO_ASK = /(까요|까|나요|가요|래요|래|죠|지요|니|냐|는데|은데|신가요|실까요|을까|ㄹ까)[\s.!…]*$/;

  function hasMark(t) {
    return /\?["'’”)\]\s]*$/.test(String(t || '').trim());
  }
  function addMark(t) {
    var v = String(t || '').trim();
    if (!v || hasMark(v)) return v;
    return v.replace(/[.!…]+$/, '') + '?';
  }

  /** 한글·영어를 함께 보고 물음표를 맞춰줍니다. */
  function askPair(ko, en) {
    var k = String(ko || '').trim();
    var e = String(en || '').trim();

    var asked = hasMark(k) || hasMark(e);
    // 양쪽 다 물음표가 없어도, 둘 다 묻는 꼴이면 물음으로 봅니다.
    if (!asked && KO_ASK.test(k) && EN_ASK.test(e)) asked = true;

    return asked ? { ko: addMark(k), en: addMark(e) } : { ko: k, en: e };
  }

  /*
   * 한국어는 기기에서 가장 나은 목소리를 그대로 씁니다.
   * 억지로 남자처럼 낮추면 웅얼거려서 듣기 나쁩니다.
   */
  function koSet() { return { voice: pickVoice('ko-KR'), pitch: 1 }; }
  function koVoice() { return koSet().voice; }
  function koPitch() { return 1; }
  var KO_RATE = 1;
  var EN_RATE = 0.9;
  var GAP_REP = 1100;   // 영어를 거듭 읽을 때 사이

  function sayOne(text, lang, rate, done) {
    var low = (lang.slice(0, 2) === 'ko');
    sayVoice(text, lang, low ? koVoice() : pickVoice(lang), rate,
             low ? koPitch() : 1, done);
  }
  function sayStop() {
    if (!say.on) return;
    say.stop = true;
    keepSaying(false);
    try {
      var s = window.speechSynthesis;
      if (s.speaking || s.pending) s.cancel();
    } catch (e) {}
    say.now = '';
  }

  /**
   * 한글 → (쉬고) → 영어 순서로 읽습니다.
   * key 는 어느 버튼이 눌렸는지 표시해 두는 이름입니다.
   */
  function sayPair(key, ko, en, after) {
    if (!say.on) return;
    unlockSay();                                            // 폰 자물쇠 풀기
    if (say.now === key) { sayStop(); render(); return; }   // 다시 누르면 멈춤

    sayStop();
    say.stop = false;
    say.now = key;
    render();

    var pair = askPair(ko, en);
    ko = pair.ko;
    en = pair.en;

    function finish() {
      if (say.now === key) say.now = '';
      render();
      if (after) after();
    }

    // cancel() 직후에 바로 말하면 삼켜지는 기기가 있어서 한 박자 쉽니다.
    setTimeout(function () {
      if (say.stop || say.now !== key) { finish(); return; }
      sayOne(ko, 'ko-KR', KO_RATE, function () {
        if (say.stop || say.now !== key) { finish(); return; }
        setTimeout(function () {
          if (say.stop || say.now !== key) { finish(); return; }
          sayOne(en, 'en-US', EN_RATE, finish);
        }, GAP_MID);
      });
    }, 120);
  }
  /** 버튼 하나 만들기 */
  function playBtn(key, label) {
    if (!say.on) return '';
    var on = (say.now === key);
    return '<button class="btn-text play' + (on ? ' on' : '') + '" data-play="' + key + '" ' +
      'title="' + (on ? '멈추기' : '한글 먼저, 그다음 영어로 읽어줍니다') + '">' +
      (on ? '■ 멈춤' : '▶ ' + (label || '듣기')) + '</button>';
  }

  /** data-play 에 적힌 이름을 보고 무엇을 읽을지 정합니다. */
  function playFrom(key) {
    unlockSay();
    var p = String(key || '').split(':');
    if (p[0] === 'q') {
      var q = state.items[p[1]];
      if (q) sayPair(key, q.korean, q.answer);
      return;
    }
    if (p[0] === 'a') {
      var ap = state.apply[p[1]];
      var one = ap && ap.list[p[2]];
      if (one) sayPair(key, one.ko, one.en);
      return;
    }
    if (p[0] === 'rv') {
      var cur = rvCurrent();
      if (!cur) return;
      var va = (rv.mode === 'apply') ? rv.vari[rv.pos] : null;
      if (va && !va.busy && !va.err) sayPair(key, va.ko, va.en);
      else sayPair(key, cur.korean, cur.answer);
    }
  }

  /* ---------- 문장별 메모장 ---------- */
  function padHtml(ix) {
    if (!state.padOpen[ix]) return '';
    var q = state.items[ix];
    var dirty = state.padDirty[ix];
    return '<div class="padbox">' +
      '<div class="phead">' +
        '<span class="tag">메모장</span>' +
        '<span class="grow"></span>' +
        '<span class="state' + (dirty ? ' dirty' : '') + '">' +
        (dirty === 'saving' ? '저장하는 중…'
          : (dirty ? '저장 안 됨' : (state.padSaved[ix] ? '저장했어요' : ''))) +
        '</span>' +
        '<button class="btn-text" data-padsave="' + ix + '">저장</button>' +
      '</div>' +
      '<textarea class="ptext" data-ptext="' + ix + '" rows="3" ' +
      'placeholder="이 문장에 대해 적어두고 싶은 것">' + esc(q.pad || '') + '</textarea>' +
      '</div>';
  }

  function padSaveNow(ix) {
    var q = state.items[ix];
    if (!q || !q.row) return;
    var box = $('stage').querySelector('[data-ptext="' + ix + '"]');
    var text = box ? box.value : (q.pad || '');

    state.padDirty[ix] = 'saving';
    render();
    call('savePad', [q.row, text], function () {
      q.pad = text;
      delete state.padDirty[ix];
      state.padSaved[ix] = true;
      render();
    }, function (e) {
      state.padDirty[ix] = true;
      render();
      msg(errText(e), 'err');
    });
  }

  /* ---------- 응용 (메모를 길잡이로 새 문장 만들기) ---------- */
  /*
   * '응용 더' 를 누르면 아래로 한 장씩 쌓입니다.
   * 마음에 드는 것만 네모를 치고 저장하면 시트 '응용' 장에 남습니다.
   */
  function applyHtml(ix) {
    var ap = state.apply[ix];
    if (!ap) return '';
    if (!ap.list.length) {
      return ap.busy ? ('<div class="applybox quiet">' + waitText(ap) + '</div>') : '';
    }

    var h = '<div class="applybox">';

    for (var j = 0; j < ap.list.length; j++) {
      var cur = ap.list[j];
      h += '<div class="aitem' + (j ? ' more' : '') + '">' +
        (cur.saved
          ? '<span class="akeep ghost"></span>'
          : ('<label class="pick akeep" title="저장할 문장 고르기">' +
             '<input type="checkbox" data-akeep="' + ix + ':' + j + '"' +
             (cur.keep ? ' checked' : '') + '><span class="box"></span></label>')) +
        '<div class="abody">' +
        '<div class="ahead">' +
          '<span class="tag">응용 ' + (j + 1) + '</span>' +
          (cur.point ? '<span class="apoint">' + esc(cur.point) + '</span>' : '') +
          (cur.saved
            ? ('<span class="asaved" title="전에 쌓아둔 것입니다">쌓아둔 것' +
               (cur.on ? ' · ' + esc(cur.on) : '') + '</span>')
            : '') +
        '</div>' +
        '<p class="ako">' + esc(cur.ko) + '</p>';

      if (cur.shown) {
        h += '<div class="rans">' +
          (cur.en ? esc(cur.en) : '영어 문장을 못 받았어요') + '</div>' +
          '<div class="acts">' +
          '<button class="btn-text" data-ahide="' + ix + ':' + j + '">가리기</button>' +
          playBtn('a:' + ix + ':' + j) +
          '</div>';
      } else {
        h += '<div class="acts">' +
          '<button class="btn-text" data-ashow="' + ix + ':' + j + '">답 보기</button>' +
          playBtn('a:' + ix + ':' + j) +
          '</div>';
      }
      h += '</div></div>';
    }

    if (ap.busy) h += '<div class="aitem more quiet">' + waitText(ap) + '</div>';

    var keeps = keepCount(ix);
    if (keeps) {
      h += '<div class="afoot">' +
        '<button class="btn-text lead" data-asave="' + ix + '"' +
        (ap.saving ? ' disabled' : '') + '>' +
        (ap.saving ? '저장하는 중…' : ('고른 ' + keeps + '개 저장')) + '</button>' +
        '</div>';
    }

    return h + '</div>';
  }

  /** 기다린 시간을 알려줍니다. 오래 걸리면 까닭도 덧붙입니다. */
  function waitText(ap) {
    var sec = ap.since ? Math.round((Date.now() - ap.since) / 1000) : 0;
    var t = '응용 문장을 만드는 중… ' + sec + '초';
    if (sec >= 15) t += ' (AI 가 붐비면 1분 넘게 걸리기도 합니다)';
    return t;
  }

  /** 기다리는 동안 숫자가 올라가게 */
  var waitTick = null;
  function waitWatch() {
    var any = false;
    for (var k in state.apply) {
      if (state.apply.hasOwnProperty(k) && state.apply[k].busy) any = true;
    }
    if (any && !waitTick) {
      waitTick = setInterval(function () {
        var on = false;
        for (var k2 in state.apply) {
          if (state.apply.hasOwnProperty(k2) && state.apply[k2].busy) on = true;
        }
        if (!on) { clearInterval(waitTick); waitTick = null; return; }
        if (state.tab === 'quiz') renderQuiz();
      }, 1000);
    }
  }

  function keepCount(ix) {
    var ap = state.apply[ix];
    if (!ap) return 0;
    var n = 0;
    for (var j = 0; j < ap.list.length; j++) {
      if (ap.list[j].keep && !ap.list[j].saved) n++;
    }
    return n;
  }

  /** 쌓아둔 것 중 아직 안 꺼낸 게 있으면 그걸 줍니다. (서버에 안 다녀옵니다) */
  function nextStored(ix) {
    var q = state.items[ix];
    var had = (q && state.vars[q.korean]) || [];
    var ap = state.apply[ix];
    var out = ap ? ap.list.map(function (x) { return x.ko; }) : [];
    for (var i = 0; i < had.length; i++) {
      if (out.indexOf(had[i].ko) === -1) return had[i];
    }
    return null;
  }

  /** 응용 문제를 하나 더 아래에 붙입니다. */
  function askApply(ix) {
    var q = state.items[ix];
    if (!q) return;
    var ap = state.apply[ix];
    if (!ap) ap = state.apply[ix] = { busy: false, saving: false, list: [] };
    if (ap.busy) return;

    if (!ap.pool) ap.pool = [];

    // 받아둔 묶음에 남은 게 있으면 기다릴 것 없이 바로 꺼냅니다.
    if (ap.pool.length) {
      showOne(ix, ap.pool.shift());
      return;
    }

    // 시트에 쌓아둔 게 있으면 그것도 기다림 없이.
    var got = nextStored(ix);
    if (got) {
      showOne(ix, { ko: got.ko, en: got.en, point: got.point,
                    saved: true, on: got.on || '' });
      return;
    }

    ap.busy = true;
    ap.since = Date.now();
    render();
    waitWatch();

    var seen = ap.list.map(function (x) { return x.ko; });
    call('getVariation', [q.korean, q.answer, q.note, seen, 3], function (res) {
      ap.busy = false;
      if (!res || !res.ok) {
        if (!ap.list.length) delete state.apply[ix];
        render();
        msg((res && res.message) || '응용 문장을 못 만들었어요.', 'err');
        return;
      }
      var got2 = res.list && res.list.length ? res.list.slice()
        : [{ ko: res.ko, en: res.en, point: res.point, saved: !!res.saved, on: res.on }];
      ap.pool = got2.slice(1);          // 나머지는 다음에 씁니다
      showOne(ix, got2[0]);
    }, function (e) {
      ap.busy = false;
      if (!ap.list.length) delete state.apply[ix];
      render();
      msg(errText(e), 'err');
    });
  }

  /** 받은 응용 하나를 화면에 붙입니다. */
  function showOne(ix, v) {
    var ap = state.apply[ix];
    if (!ap || !v) return;
    ap.list.push({ ko: v.ko, en: v.en, point: v.point,
                   saved: !!v.saved, on: v.on || '',
                   shown: false, keep: false });
    msg('');
    render();
  }

  /*
   * 다음 응용을 뒤에서 미리 받아둡니다.
   * '응용 더' 를 누를 때 기다리지 않게 하려는 것입니다. 화면은 안 건드립니다.
   */
  function preApply(ix) {
    var q = state.items[ix];
    var ap = state.apply[ix];
    if (!q || !ap || ap.pre) return;
    if (ap.pool && ap.pool.length) return;
    if (nextStored(ix)) return;

    ap.pre = true;
    var seen = ap.list.map(function (x) { return x.ko; });
    call('getVariation', [q.korean, q.answer, q.note, seen, 3], function (res) {
      ap.pre = false;
      if (res && res.ok && res.list && res.list.length) {
        ap.pool = (ap.pool || []).concat(res.list);
      }
    }, function () { ap.pre = false; });
  }


  /** 네모 친 것들을 시트 '응용' 장에 쌓습니다. */
  function applySave(ix) {
    var q = state.items[ix];
    var ap = state.apply[ix];
    if (!q || !ap || ap.saving) return;

    var send = [], mine = [];
    for (var j = 0; j < ap.list.length; j++) {
      var c = ap.list[j];
      if (!c.keep || c.saved) continue;
      send.push({ ko: c.ko, en: c.en, point: c.point });
      mine.push(j);
    }
    if (!send.length) return;

    ap.saving = true;
    render();

    call('saveVars', [q.korean, send], function (res) {
      ap.saving = false;
      var on = (res && res.on) || '';
      var box = (state.vars[q.korean] = state.vars[q.korean] || []);
      mine.forEach(function (j) {
        ap.list[j].saved = true;
        ap.list[j].keep = false;
        ap.list[j].on = on;
        box.push({ of: q.korean, ko: ap.list[j].ko, en: ap.list[j].en,
                   point: ap.list[j].point, on: on });
      });
      render();
      msg(send.length + '개를 이 문장의 응용으로 쌓았어요.', 'ok');
    }, function (e) {
      ap.saving = false;
      render();
      msg(errText(e), 'err');
    });
  }
  function pageMarked() {
    var p = pageIdx();
    if (!p.length) return false;
    for (var i = 0; i < p.length; i++) {
      if (!state.marked[p[i]]) return false;
    }
    return true;
  }

  function renderQuiz() {
    var total = state.queue.length;
    var p = pageIdx();
    var from = state.page * state.pageSize;

    $('where').textContent = scopeLabel();
    $('progress').textContent = total
      ? ((from + 1) + '–' + Math.min(from + p.length, total) + ' / ' + total)
      : '';
    $('score').innerHTML = (state.tally.done || state.tally.review)
      ? ('<b>암기 ' + state.tally.done + '</b> · <i>복습 ' + state.tally.review + '</i>')
      : '';
    $('bar').style.width = total ? ((from + p.length) * 100 / total) + '%' : '0%';

    var el = $('stage');

    if (state.loading) {
      el.innerHTML = '<div class="blank">불러오는 중…</div>';
      return;
    }
    if (!state.items.length) {
      el.innerHTML = '<div class="blank"><strong>시트가 비어 있어요</strong>' +
        '아래 <b>시트 열기</b>를 눌러 문장을 적어주세요.</div>';
      return;
    }
    if (!total) {
      el.innerHTML = '<div class="blank"><strong>여기엔 문장이 없어요</strong>' +
        '왼쪽에서 다른 범위를 골라보세요.</div>';
      return;
    }
    if (!p.length) {
      el.innerHTML = '<div class="done-panel">' +
        '<div class="big">한 바퀴 끝</div>' +
        '<div class="line">' + total + '문장 · 암기 ' + state.tally.done +
        ' · 복습 필요 ' + state.tally.review + '</div>' +
        '<button class="btn-go" id="again">다시 돌기</button>' +
        '</div>';
      wire('again', function () { build(); render(); });
      return;
    }

    var h = '<div class="stage"><ul class="qlist">';
    for (var i = 0; i < p.length; i++) h += cardHtml(p[i], from + i + 1);
    h += '</ul>';

    var rest = total - from - p.length;
    var marks = markedOnPage();
    var picks = pickedOnPage();

    h += '<div class="page-acts">' +
      (rest > 0
        ? ('<button class="btn-go" id="next-page">다음 ' +
           Math.min(state.pageSize, rest) + '문장 →</button>')
        : '<button class="btn-go" id="next-page">마무리 →</button>') +
      (picks.length
        ? ('<button class="btn-mid" id="undo-picked">고른 ' + picks.length +
           '개 되돌리기</button>')
        : (pageMarked() ? ''
           : '<span class="note">입으로 말해보고 답을 펼쳐 점검하세요</span>')) +
      '<span class="grow"></span>' +
      (marks.length
        ? ('<button class="btn-text" id="pick-all">' +
           (picks.length === marks.length ? '고른 것 풀기' : '이 쪽 전부 고르기') +
           '</button>')
        : '') +
      (scopeMarkedAll().length
        ? ('<button class="btn-text" id="undo-scope">' + scopeLabel() + ' 전부 되돌리기 (' +
           scopeMarkedAll().length + ')</button>')
        : '') +
      (state.page > 0 ? '<button class="btn-text" id="prev-page">← 이전</button>' : '') +
      '<button class="btn-text" id="reveal-all">전부 펼치기</button>' +
      '</div></div>';

    // 다시 그려도 보던 자리에 그대로 있어야 합니다.
    var keepY = window.scrollY || window.pageYOffset || 0;
    el.innerHTML = h;
    wire('next-page', nextPage);
    wire('prev-page', prevPage);
    wire('reveal-all', function () {
      pageIdx().forEach(function (ix) { state.revealed[ix] = true; });
      render();
    });
    wire('undo-picked', function () { undoMany(pickedOnPage()); });
    wire('pick-all', function () {
      var all = markedOnPage();
      var on = pickedOnPage().length !== all.length;
      all.forEach(function (ix) {
        if (on) state.checked[ix] = true; else delete state.checked[ix];
      });
      render();
    });
    wire('undo-scope', function () {
      var all = scopeMarkedAll();
      if (!all.length) return;
      if (!window.confirm(scopeLabel() + ' 에 있는 ' + all.length +
          '문장의 표시를 모두 지울까요?')) return;
      undoMany(all);
    });

    // 커서는 부탁받았을 때만, 그리고 마우스로 쓰는 기계에서만 옮깁니다.
    var want = null;
    if (state.focusIx !== null) {
      if (finePointer()) {
        want = el.querySelector('textarea[data-ans="' + state.focusIx + '"]');
      }
      state.focusIx = null;
    }
    if (want && !state.busy) {
      try { want.focus({ preventScroll: true }); } catch (e) { want.focus(); }
    }
    window.scrollTo(0, keepY);
  }

  function wire(id, fn) {
    var el = $(id);
    if (el) el.addEventListener('click', fn);
  }

  function renderFoot() {
    $('ai-state').innerHTML = state.hasKey
      ? '<span class="ai-on">AI 힌트 켜짐</span>'
      : 'AI 힌트 꺼짐 — 시트에 적어둔 답으로 힌트를 만듭니다';
  }


  /** 왼쪽 범위 버튼에 지금 고른 것과 문장 수를 표시합니다. */
  function renderScopes() {
    var box = $('scopes');
    if (!box) return;
    var save = state.scope;
    var btns = box.querySelectorAll('[data-scope]');
    for (var i = 0; i < btns.length; i++) {
      var sc = btns[i].getAttribute('data-scope');
      state.scope = sc;
      var n = pickIdx().length;
      btns[i].className = (sc === save ? 'on' : '');
      var lab = btns[i].getAttribute('data-label');
      if (!lab) { lab = btns[i].textContent; btns[i].setAttribute('data-label', lab); }
      btns[i].textContent = lab + (n ? ' (' + n + ')' : '');
    }
    state.scope = save;
  }

  function render() {
    renderCal();
    renderScopes();
    if (state.tab === 'diary') renderDiary();
    else renderQuiz();
    renderNotes();
    renderFoot();
  }


  /* ---------- 표시하기 ---------- */
  function markOne(ix, status) {
    var it = state.items[ix];
    if (!it) return;
    var mine = null;   // 쓰는 칸이 없으니 시트의 내 답은 그대로 둡니다

    // 화면은 바로 바꾸고, 저장은 뒤에서 합니다.
    if (state.marked[ix]) {
      if (state.marked[ix].status === ST_DONE) state.tally.done--;
      else state.tally.review--;
    }
    if (status) {
      state.marked[ix] = { status: status };
      if (status === ST_DONE) state.tally.done++; else state.tally.review++;
      delete state.revealed[ix];
      delete state.hints[ix];

    } else {
      delete state.marked[ix];
      state.focusIx = ix;
    }
    it.status = status;
    render();

    call('markItem', [it.row, it.korean, mine, status], function (res) {
      if (status) delete state.history[it.korean];
    }, function (e) {
      msg(errText(e), 'err');
    });
  }


  /** 고른 문장들의 표시를 한 번에 지웁니다. */
  function undoMany(list) {
    if (!list || !list.length) return;
    var send = [];
    list.forEach(function (ix) {
      var it = state.items[ix];
      if (!it) return;
      if (state.marked[ix]) {
        if (state.marked[ix].status === ST_DONE) state.tally.done--;
        else state.tally.review--;
        delete state.marked[ix];
      }
      it.status = '';
      delete state.checked[ix];

      send.push({ row: it.row, korean: it.korean, mine: '', status: '' });
    });
    render();
    msg(send.length + '문장을 되돌렸어요.', 'ok');
    call('markMany', [send], function () {}, function (e) {
      msg(errText(e), 'err');
    });
  }

  function doHint(ix) {
    var q = state.items[ix];
    if (!q) return;
    var lv = state.hints[ix] ? Math.min(3, state.hints[ix].level + 1) : 1;

    // 시트에 답이 있으면 서버에 안 물어보고 바로 만듭니다.
    var local = localHint(q.answer, lv);
    if (local) {
      state.hints[ix] = { text: local, level: lv, ai: false };
      render();
      return;
    }

    state.busy = true;
    state.hints[ix] = { text: '생각하는 중…', level: lv, ai: state.hasKey };
    render();

    call('getHint', [q.korean, q.answer, '', lv], function (res) {
      state.busy = false;
      state.hints[ix] = { text: (res && res.text) || '', level: lv, ai: !!(res && res.ai) };
      render();
    }, function (e) {
      state.busy = false;
      delete state.hints[ix];
      render();
      msg(errText(e), 'err');
    });
  }

  function prevPage() {
    if (state.page <= 0) return;
    state.page--;
    msg('');
    render();
    try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {}
  }

  function nextPage() {
    sayStop();
    state.page++;
    msg('');
    render();
    try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {}
  }

  /* ---------- 이력 ---------- */
  function histHtml(korean) {
    var rows = state.history[korean];
    if (rows === undefined) {
      return '<div class="hist-box quiet">이력을 불러오는 중…</div>';
    }
    if (!rows.length) {
      return '<div class="hist-box quiet">아직 기록이 없어요.</div>';
    }
    var h = '<div class="hist-box">';
    rows.forEach(function (r) {
      var p = String(r.date || '').split('-');
      h += '<div class="hrow">' +
        '<span class="hd">' + (p.length > 2 ? ((+p[1]) + '. ' + (+p[2]) + '.') : '—') +
        '</span>' +
        '<span class="hm">' + (esc(r.mine) || '—') + '</span>' +
        '</div>';
    });
    return h + '</div>';
  }

  function fetchHist(korean) {
    call('getHistory', [korean], function (rows) {
      state.history[korean] = rows || [];
      render();
    }, function (e) {
      state.history[korean] = [];
      render();
      msg(errText(e), 'err');
    });
  }

  function toggleHist(ix) {
    var ko = state.items[ix].korean;
    if (state.histOpen[ix]) {
      delete state.histOpen[ix];
      render();
      return;
    }
    state.histOpen[ix] = true;
    render();
    if (state.history[ko] === undefined) fetchHist(ko);
  }
  /* ---------- 노트 (날짜별 표) ---------- */
  /*
   * 표는 state.noteRows 를 그대로 그린 것입니다.
   * 글자를 칠 때는 다시 그리지 않고(커서가 날아가니까) 값만 담아둡니다.
   * 줄을 끼우거나 지우거나 붙여넣을 때만 다시 그립니다.
   */
  var NOTE_MIN_ROWS = 6;
  var NOTE_COLS = 2;

  // 드래그로 고른 칸 범위
  var nsel = { on: false, r1: 0, c1: 0, r2: 0, c2: 0, live: false };

  function noteRowsFor(d) {
    var rows = state.notes
      .filter(function (n) { return n.date === d; })
      .map(function (n) { return { en: n.en, ko: n.ko }; });
    while (rows.length < NOTE_MIN_ROWS) rows.push({ en: '', ko: '' });
    return rows;
  }

  function noteCellVal(r, c) {
    var row = state.noteRows[r];
    if (!row) return '';
    return (c === 0 ? row.en : row.ko) || '';
  }
  function setNoteCell(r, c, v) {
    while (state.noteRows.length <= r) state.noteRows.push({ en: '', ko: '' });
    if (c === 0) state.noteRows[r].en = v; else state.noteRows[r].ko = v;
  }

  function noteRowHtml(r, i) {
    return '<div class="nrow" data-r="' + i + '">' +
      '<span class="nh">' +
        '<b class="rn">' + (i + 1) + '</b>' +
        '<button class="rb" data-ins="' + i + '" title="아래에 칸 넣기">+</button>' +
        '<button class="rb" data-del="' + i + '" title="이 칸 지우기">&times;</button>' +
      '</span>' +
      '<input class="nen" data-r="' + i + '" data-c="0" value="' + esc(r.en) + '">' +
      '<input class="nko" data-r="' + i + '" data-c="1" value="' + esc(r.ko) + '">' +
      '</div>';
  }

  function setNoteState(kind) {
    var el = $('note-state');
    if (!el) return;
    if (kind === 'dirty') { el.textContent = '저장 안 됨'; el.className = 'state dirty'; }
    else if (kind === 'saved') { el.textContent = '저장했어요'; el.className = 'state saved'; }
    else if (kind === 'saving') { el.textContent = '저장하는 중…'; el.className = 'state'; }
    else { el.textContent = ''; el.className = 'state'; }
  }

  /** state.noteRows 를 화면에 그립니다. (커서 자리는 알려주면 되살립니다) */
  function drawNoteGrid(focusR, focusC) {
    var grid = $('note-grid');
    if (!grid) return;

    var h = '<div class="nrow head">' +
      '<span class="nh"></span><span>영어</span><span>풀이</span></div>';
    for (var i = 0; i < state.noteRows.length; i++) {
      h += noteRowHtml(state.noteRows[i], i);
    }
    grid.innerHTML = h;

    var filled = state.noteRows.filter(function (r) { return r.en || r.ko; }).length;
    if ($('note-n')) $('note-n').textContent = filled ? (filled + '개') : '';

    paintSel();

    if (focusR !== undefined && focusR !== null) {
      var el = grid.querySelector(
        'input[data-r="' + focusR + '"][data-c="' + (focusC || 0) + '"]');
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }
  }

  function renderNotes(force) {
    var grid = $('note-grid');
    if (!grid) return;                      // 테스트 쪽에는 노트가 없습니다
    var d = state.selDate || todayKey();

    if (!force && state.noteFor === d) return;
    state.noteFor = d;

    var p = diaryTitle(d);
    if ($('note-day')) $('note-day').textContent = p.title.split('년 ')[1];

    state.noteRows = noteRowsFor(d);
    nsel.on = false;
    drawNoteGrid();
    setNoteState();
  }

  /* ---------- 줄 넣고 빼기 ---------- */
  function insertNoteRow(at) {
    var i = Math.max(0, Math.min(state.noteRows.length, Number(at) + 1));
    state.noteRows.splice(i, 0, { en: '', ko: '' });
    nsel.on = false;
    setNoteState('dirty');
    drawNoteGrid(i, 0);
  }

  function deleteNoteRow(at) {
    var i = Number(at);
    if (i < 0 || i >= state.noteRows.length) return;
    state.noteRows.splice(i, 1);
    if (!state.noteRows.length) state.noteRows.push({ en: '', ko: '' });
    nsel.on = false;
    setNoteState('dirty');
    drawNoteGrid(Math.min(i, state.noteRows.length - 1), 0);
  }

  function addNoteRow(focus) {
    state.noteRows.push({ en: '', ko: '' });
    setNoteState('dirty');
    drawNoteGrid(focus ? state.noteRows.length - 1 : null, 0);
  }

  /* ---------- 칸 고르기 (엑셀처럼 끌어서) ---------- */
  function selBox() {
    return {
      r1: Math.min(nsel.r1, nsel.r2), r2: Math.max(nsel.r1, nsel.r2),
      c1: Math.min(nsel.c1, nsel.c2), c2: Math.max(nsel.c1, nsel.c2)
    };
  }
  function selCount() {
    if (!nsel.on) return 0;
    var b = selBox();
    return (b.r2 - b.r1 + 1) * (b.c2 - b.c1 + 1);
  }
  function paintSel() {
    var grid = $('note-grid');
    if (!grid) return;
    var all = grid.querySelectorAll('input[data-r]');
    var b = nsel.on ? selBox() : null;
    for (var i = 0; i < all.length; i++) {
      var r = +all[i].getAttribute('data-r');
      var c = +all[i].getAttribute('data-c');
      var inside = b && r >= b.r1 && r <= b.r2 && c >= b.c1 && c <= b.c2;
      all[i].className = (c === 0 ? 'nen' : 'nko') + (inside ? ' sel' : '');
    }
    var tag = $('note-sel');
    if (tag) {
      var k = selCount();
      tag.textContent = k > 1 ? (k + '칸 고름 · Ctrl+C 복사') : '';
    }
  }
  function clearSel() {
    if (!nsel.on) return;
    nsel.on = false;
    paintSel();
  }

  /** 고른 칸들을 엑셀이 알아듣는 글자(탭·줄바꿈)로 만듭니다. */
  function selText() {
    var b = selBox(), lines = [];
    for (var r = b.r1; r <= b.r2; r++) {
      var cells = [];
      for (var c = b.c1; c <= b.c2; c++) cells.push(noteCellVal(r, c));
      lines.push(cells.join(String.fromCharCode(9)));
    }
    return lines.join(String.fromCharCode(10));
  }

  /**
   * 여러 칸을 골랐으면 그 내용을 안 보이는 칸에 담고 커서를 옮깁니다.
   * 그러면 Ctrl+C · Ctrl+X 를 브라우저가 알아서 처리합니다.
   * (앱스 스크립트 틀 안에서는 우리가 직접 복사하는 길이 막혀 있습니다.)
   */
  function armClip() {
    var clip = $('note-clip');
    if (!clip) return;
    if (selCount() < 2) return;
    clip.value = selText();
    clip.focus();
    clip.select();
  }

  /** 붙여넣은 글자를 (r, c) 자리부터 깝니다. 모자라면 줄을 늘립니다. */
  function pasteAt(r0, c0, text) {
    var NL = String.fromCharCode(10);
    var body = String(text || '').replace(/\r\n/g, NL).replace(/\r/g, NL);
    var lines = body.split(NL);
    while (lines.length && lines[lines.length - 1] === '') lines.pop();
    if (!lines.length) return;

    for (var i = 0; i < lines.length; i++) {
      var cells = lines[i].split(String.fromCharCode(9));
      for (var j = 0; j < cells.length; j++) {
        var c = c0 + j;
        if (c >= NOTE_COLS) break;          // 두 칸까지만
        setNoteCell(r0 + i, c, cells[j]);
      }
    }

    nsel.on = true;
    nsel.r1 = r0; nsel.c1 = c0;
    nsel.r2 = r0 + lines.length - 1;
    nsel.c2 = Math.min(NOTE_COLS - 1, c0 + lines[0].split(String.fromCharCode(9)).length - 1);

    setNoteState('dirty');
    drawNoteGrid();
    armClip();
  }

  function clearSelCells() {
    var b = selBox();
    for (var r = b.r1; r <= b.r2; r++) {
      for (var c = b.c1; c <= b.c2; c++) setNoteCell(r, c, '');
    }
    setNoteState('dirty');
    drawNoteGrid();
  }

  /* ---------- 저장 ---------- */
  function saveNotesNow() {
    var d = state.noteFor || state.selDate || todayKey();
    var rows = state.noteRows.map(function (r) {
      return { en: r.en || '', ko: r.ko || '' };
    });

    if ($('note-save')) $('note-save').disabled = true;
    setNoteState('saving');

    call('saveNotes', [d, rows], function (notes) {
      if ($('note-save')) $('note-save').disabled = false;
      state.notes = notes || [];
      // 화면에 적은 대로 그대로 둡니다. 빈 줄도 그대로 남겨둡니다.
      setNoteState('saved');
    }, function (e) {
      if ($('note-save')) $('note-save').disabled = false;
      setNoteState('dirty');
      msg(errText(e), 'err');
    });
  }

  /* ---------- 표에서 일어나는 일 (위임으로 한 번만) ---------- */
  var dp = $('diary-panel');

  dp.addEventListener('click', function (e) {
    if (!e.target.closest) return;
    if (e.target.closest('#note-save')) { saveNotesNow(); return; }
    if (e.target.closest('#note-add')) { addNoteRow(true); return; }

    var ins = e.target.closest('[data-ins]');
    if (ins) { insertNoteRow(ins.getAttribute('data-ins')); return; }
    var del = e.target.closest('[data-del]');
    if (del) { deleteNoteRow(del.getAttribute('data-del')); return; }

    var db = e.target.closest('[data-dsave]');
    if (db) { saveDiaryNow(db.getAttribute('data-dsave')); return; }
  });

  dp.addEventListener('input', function (e) {
    var t = e.target;
    if (!t.getAttribute || t.getAttribute('data-r') === null) return;
    setNoteCell(+t.getAttribute('data-r'), +t.getAttribute('data-c'), t.value);
    setNoteState('dirty');
    var filled = state.noteRows.filter(function (r) { return r.en || r.ko; }).length;
    if ($('note-n')) $('note-n').textContent = filled ? (filled + '개') : '';
    // 마지막 줄을 쓰기 시작하면 빈 줄을 하나 더 깔아둡니다.
    if (+t.getAttribute('data-r') === state.noteRows.length - 1) {
      state.noteRows.push({ en: '', ko: '' });
      $('note-grid').insertAdjacentHTML('beforeend',
        noteRowHtml({ en: '', ko: '' }, state.noteRows.length - 1));
    }
  });

  // 끌어서 칸 고르기
  dp.addEventListener('mousedown', function (e) {
    var t = e.target;
    if (!t.getAttribute || t.getAttribute('data-r') === null) { clearSel(); return; }
    nsel.r1 = nsel.r2 = +t.getAttribute('data-r');
    nsel.c1 = nsel.c2 = +t.getAttribute('data-c');
    nsel.on = false;      // 한 칸만 누른 거면 그냥 글자 고치기입니다
    nsel.live = true;
    paintSel();
  });

  dp.addEventListener('mouseover', function (e) {
    if (!nsel.live) return;
    var t = e.target;
    if (!t.getAttribute || t.getAttribute('data-r') === null) return;
    var r = +t.getAttribute('data-r');
    var c = +t.getAttribute('data-c');
    if (r === nsel.r2 && c === nsel.c2) return;
    nsel.r2 = r; nsel.c2 = c;
    nsel.on = true;
    // 끌 때 브라우저가 글자를 따로 잡는 걸 막습니다.
    try { window.getSelection().removeAllRanges(); } catch (err) {}
    paintSel();
  });

  document.addEventListener('mouseup', function () {
    if (!nsel.live) return;
    nsel.live = false;
    armClip();          // 끌기를 마치면 바로 복사할 수 있게 담아둡니다
  });

  /* 안 보이는 칸에서 벌어지는 일 */
  dp.addEventListener('cut', function (e) {
    if (e.target.id !== 'note-clip' || selCount() < 2) return;
    // 브라우저가 글자를 가져간 뒤에 표를 비웁니다.
    setTimeout(function () {
      var k = selCount();
      clearSelCells();
      msg(k + '칸을 잘라냈어요.', 'ok');
    }, 0);
  });

  dp.addEventListener('copy', function (e) {
    if (e.target.id !== 'note-clip' || selCount() < 2) return;
    msg(selCount() + '칸을 복사했어요.', 'ok');
  });

  dp.addEventListener('paste', function (e) {
    if (e.target.id !== 'note-clip') return;
    var text = (e.clipboardData || window.clipboardData).getData('text');
    e.preventDefault();
    if (!text) return;
    var b = selBox();
    pasteAt(b.r1, b.c1, text);
  });

  dp.addEventListener('keydown', function (e) {
    if (e.target.id !== 'note-clip') return;
    if ((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'Enter')) {
      e.preventDefault(); saveNotesNow(); return;
    }
    if (e.key === 'Delete' || e.key === 'Backspace') {
      e.preventDefault(); clearSelCells(); return;
    }
    if (e.key === 'Escape') {
      e.preventDefault();
      var b = selBox();
      clearSel();
      drawNoteGrid(b.r1, b.c1);
    }
  });

  dp.addEventListener('keydown', function (e) {
    var t = e.target;
    if (!t.getAttribute || t.getAttribute('data-r') === null) return;
    var r = +t.getAttribute('data-r');
    var c = +t.getAttribute('data-c');

    // 저장
    if ((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'Enter')) {
      e.preventDefault(); saveNotesNow(); return;
    }
    if (e.key === 'Escape') { clearSel(); return; }

    // 줄 넣기 / 빼기
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { return; }
    if (e.altKey && e.key === 'Enter') { e.preventDefault(); insertNoteRow(r); return; }

    // 칸 사이 옮겨 다니기
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (r + 1 >= state.noteRows.length) addNoteRow(false);
      clearSel();
      drawNoteGrid(r + 1, c);
      return;
    }
    if (e.key === 'ArrowDown' && r + 1 < state.noteRows.length) {
      e.preventDefault(); clearSel(); drawNoteGrid(r + 1, c); return;
    }
    if (e.key === 'ArrowUp' && r > 0) {
      e.preventDefault(); clearSel(); drawNoteGrid(r - 1, c); return;
    }
  });

  // 엑셀·구글 시트에서 그대로 붙여넣기
  dp.addEventListener('paste', function (e) {
    var t = e.target;
    if (!t.getAttribute || t.getAttribute('data-r') === null) return;
    var text = (e.clipboardData || window.clipboardData).getData('text');
    if (!text || (text.indexOf(String.fromCharCode(9)) < 0 &&
                  text.indexOf(String.fromCharCode(10)) < 0)) {
      return;                       // 한 칸짜리는 그냥 평소대로 붙습니다
    }
    e.preventDefault();
    pasteAt(+t.getAttribute('data-r'), +t.getAttribute('data-c'), text);
  });

  /* ---------- 카드 안 버튼·메모장 (위임으로 한 번만) ---------- */
  $('stage').addEventListener('input', function (e) {
    var ix = e.target.getAttribute && e.target.getAttribute('data-ptext');
    if (ix === null || ix === undefined) return;
    if (state.padDirty[ix] === true) return;      // 이미 표시해 뒀습니다
    state.padDirty[ix] = true;
    delete state.padSaved[ix];
    var st = e.target.closest('.padbox').querySelector('.state');
    if (st) { st.textContent = '저장 안 됨'; st.className = 'state dirty'; }
  });

  $('stage').addEventListener('keydown', function (e) {
    var ix = e.target.getAttribute && e.target.getAttribute('data-ptext');
    if (ix === null || ix === undefined) return;
    if ((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'Enter')) {
      e.preventDefault();
      padSaveNow(ix);
    }
  });

  $('stage').addEventListener('change', function (e) {
    var ak = e.target.getAttribute && e.target.getAttribute('data-akeep');
    if (ak !== null && ak !== undefined) {
      var p = ak.split(':');
      var ap = state.apply[p[0]];
      if (ap && ap.list[p[1]]) ap.list[p[1]].keep = e.target.checked;
      render();
      return;
    }
    var ix = e.target.getAttribute && e.target.getAttribute('data-pick');
    if (ix === null || ix === undefined) return;
    if (e.target.checked) state.checked[ix] = true;
    else delete state.checked[ix];
    render();
  });

  $('stage').addEventListener('click', function (e) {
    if (!e.target.closest) return;

    // 원문 문장을 누르면 펼쳐둔 응용을 접습니다.
    var fold = e.target.closest('[data-kofold]');
    if (fold && !e.target.closest('button')) {
      delete state.apply[fold.getAttribute('data-kofold')];
      render();
      return;
    }

    var b = e.target.closest('button');
    if (!b) return;
    var ix = b.getAttribute('data-hist');
    if (ix !== null) { toggleHist(ix); return; }
    ix = b.getAttribute('data-pad');
    if (ix !== null) {
      if (state.padOpen[ix]) delete state.padOpen[ix];
      else { state.padOpen[ix] = true; state.focusIx = null; }
      delete state.padSaved[ix];
      render();
      return;
    }
    ix = b.getAttribute('data-padsave');
    if (ix !== null) { padSaveNow(ix); return; }
    ix = b.getAttribute('data-note');
    if (ix !== null) {
      if (state.noteOpen[ix]) delete state.noteOpen[ix];
      else state.noteOpen[ix] = true;
      render();
      return;
    }
    ix = b.getAttribute('data-hint');
    if (ix !== null) { doHint(ix); return; }

    var pk = b.getAttribute('data-play');
    if (pk !== null) { playFrom(pk); return; }
    ix = b.getAttribute('data-apply');
    if (ix !== null) { askApply(ix); return; }
    var pair = b.getAttribute('data-ashow') || b.getAttribute('data-ahide');
    if (pair !== null) {
      var pp = pair.split(':');
      var ap0 = state.apply[pp[0]];
      if (ap0 && ap0.list[pp[1]]) {
        ap0.list[pp[1]].shown = (b.getAttribute('data-ashow') !== null);
        render();
      }
      return;
    }
    ix = b.getAttribute('data-asave');
    if (ix !== null) { applySave(ix); return; }
    ix = b.getAttribute('data-aclose');
    if (ix !== null) { delete state.apply[ix]; render(); return; }
    ix = b.getAttribute('data-nohint');
    if (ix !== null) { delete state.hints[ix]; state.focusIx = ix; render(); return; }
    ix = b.getAttribute('data-show');
    if (ix !== null) { state.revealed[ix] = true; render(); return; }
    ix = b.getAttribute('data-hide');
    if (ix !== null) { delete state.revealed[ix]; state.focusIx = ix; render(); return; }
    ix = b.getAttribute('data-unmark');
    if (ix !== null) { markOne(ix, ''); return; }
    var mk = b.getAttribute('data-mark');
    if (mk !== null) {
      var cut = mk.lastIndexOf(':');
      markOne(mk.slice(cut + 1), mk.slice(0, cut));
      return;
    }
  });

  /* ---------- 처음으로 ---------- */
  function goHome() {
    var t = new Date();
    state.y = t.getFullYear();
    state.m = t.getMonth();
    state.selDate = todayKey();
    if (state.scope !== 'all') { state.scope = 'all'; build(); }
    else { state.page = 0; }
    msg('');
    setTab('quiz');
    try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {}
  }

  /* ---------- 이벤트 ---------- */
  $('home').addEventListener('click', goHome);
  $('home').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goHome(); }
  });
  $('mode-quiz').addEventListener('click', function () { setTab('quiz'); });
  $('mode-diary').addEventListener('click', function () { setTab('diary'); });

  $('prev').addEventListener('click', function () {
    state.m--; if (state.m < 0) { state.m = 11; state.y--; }
    renderCal();
  });
  $('month-rev').addEventListener('click', function () {
    openReview(monthKeyOf(state.y, state.m), '월간');
  });
  $('next').addEventListener('click', function () {
    state.m++; if (state.m > 11) { state.m = 0; state.y++; }
    renderCal();
  });
  $('cal-grid').addEventListener('click', function (e) {
    if (!e.target.closest) return;
    var wkb = e.target.closest('[data-week]');
    if (wkb) { if (!wkb.classList.contains('none')) openReview(wkb.getAttribute('data-week')); return; }
    var btn = e.target.closest('[data-day]');
    if (!btn) return;
    state.selDate = btn.getAttribute('data-day');
    if (state.tab === 'diary') { msg(''); render(); return; }
    state.scope = 'date';
    build(); msg(''); render();
  });
  $('scopes').addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('[data-scope]');
    if (!btn) return;
    state.scope = btn.getAttribute('data-scope');
    build(); msg(''); render();
  });
  $('restart').addEventListener('click', function () { build(); msg(''); render(); });


  $('ai-test').addEventListener('click', function () {
    msg('확인하는 중…');
    call('testAiKey', [], function (res) {
      state.hasKey = !!(res && res.ok);
      renderFoot();
      msg((res && res.message) || '', (res && res.ok) ? 'ok' : 'err');
    }, function (e) { msg(errText(e), 'err'); });
  });

  $('reload').addEventListener('click', function () {
    msg('시트에서 다시 읽는 중…');
    call('listAll', [], function (data) {
      state.items = (data && data.items) || [];
      state.diary = {};
      ((data && data.diary) || []).forEach(function (e) {
        state.diary[e.date] = { text: e.text, note: e.note, fix: e.fix };
      });
      state.notes = (data && data.notes) || [];
      state.vars = {};
      ((data && data.vars) || []).forEach(function (v) {
        (state.vars[v.of] = state.vars[v.of] || []).push(v);
      });

      state.hasKey = !!(data && data.hasKey);
      build();
      state.diaryFor = null;
      render();
      msg(state.items.length + '문장 불러왔어요.', 'ok');
    }, function (e) { msg(errText(e), 'err'); });
  });

  $('open-sheet').addEventListener('click', function () {
    msg('시트 주소를 가져오는 중…');
    call('showSpreadsheetUrl', [], function (url) {
      msg('');
      if (url) window.open(url, '_blank');
    }, function (e) { msg(errText(e), 'err'); });
  });

  /* ---------- 자물쇠 ---------- */
  var PASS_STORE = 'study.pass';

  function gateMsg(t) {
    var el = $('gate-msg');
    if (el) el.textContent = t || '';
  }

  function lockUp(text) {
    state.token = '';
    try { localStorage.removeItem(PASS_STORE); } catch (e) {}
    $('wrap').hidden = true;
    $('gate').hidden = false;
    gateMsg(text || '');
    var pw = $('gate-pw');
    if (pw) { pw.value = ''; pw.focus(); }
  }

  /** until 은 이 표를 언제까지 쓸 수 있는지 (YYYY-MM-DD) */
  function letIn(token, until) {
    state.token = token;
    try {
      localStorage.setItem(PASS_STORE,
        JSON.stringify({ token: token, until: until || '' }));
    } catch (e) {}
    $('gate').hidden = true;
    $('wrap').hidden = false;
    load();
  }

  $('gate-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = $('gate-pw').value;
    if (!pw) { gateMsg('비밀번호를 넣어주세요.'); return; }
    if (!serverOk()) {
      gateMsg('서버 주소가 아직 안 들어갔어요.');
      return;
    }
    $('gate-go').disabled = true;
    gateMsg('확인하는 중…');
    post('login', [pw], function (res) {
      $('gate-go').disabled = false;
      if (res && res.ok) { gateMsg(''); letIn(res.token, res.until); }
      else {
        gateMsg((res && res.message) || '비밀번호가 달라요.');
        var el = $('gate-pw'); el.value = ''; el.focus();
      }
    }, function (err) {
      $('gate-go').disabled = false;
      gateMsg(errText(err));
    });
  });

  /* ---------- 시작 ---------- */
  // 한 번 들어오면 한 달 동안 안 묻습니다. 기한이 지나야 다시 물어봅니다.
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(PASS_STORE) || 'null'); } catch (e) {}
  if (saved && saved.token && saved.until && saved.until >= todayKey()) {
    letIn(saved.token, saved.until);
  } else {
    lockUp();
  }
})();
</script>
</body>
</html>
