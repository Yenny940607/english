<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Honor your daily promise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Gowun+Batang:wght@400;700&family=Instrument+Serif:ital@0;1&display=swap">
  <style>
    :root{
      --ground:#fbfaf8; --panel:#ffffff; --sunken:#f4f2ee;
      --ink:#16171a; --ink-2:#5a5c60; --ink-3:#93949a;
      --line:#e7e5e0; --line-soft:#f0eeea;
      --accent:#265a4d; --accent-2:#3d7a6a; --accent-soft:rgba(38,90,77,.13);
      --ok:#2b6152; --mid:#8a6a2f; --bad:#9c453a;
      --font-ui:"IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI",
                "Malgun Gothic", sans-serif;
      --font-say:"Gowun Batang", "Apple SD Gothic Neo", "Malgun Gothic", serif;
      --font-title:"Instrument Serif", "Gowun Batang", Georgia, serif;
    }
    @media (prefers-color-scheme: dark){
      :root:not([data-theme="light"]){
        --ground:#141518; --panel:#191b1e; --sunken:#202327;
        --ink:#eceded; --ink-2:#a8aaae; --ink-3:#74767b;
        --line:#2c2f34; --line-soft:#232629;
        --accent:#5d9b8a; --accent-2:#79b3a2; --accent-soft:rgba(93,155,138,.22);
        --ok:#6fae9c; --mid:#c8a266; --bad:#d98a7e;
      }
    }
    :root[data-theme="dark"]{
      --ground:#141518; --panel:#191b1e; --sunken:#202327;
      --ink:#eceded; --ink-2:#a8aaae; --ink-3:#74767b;
      --line:#2c2f34; --line-soft:#232629;
      --accent:#5d9b8a; --accent-2:#79b3a2; --accent-soft:rgba(93,155,138,.22);
      --ok:#6fae9c; --mid:#c8a266; --bad:#d98a7e;
    }

    *{box-sizing:border-box}
    body{
      margin:0; background:var(--ground); color:var(--ink);
      font-family:var(--font-ui); font-size:16px; line-height:1.6;
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    }
    .wrap{max-width:1180px; margin:0 auto; padding:22px 24px 64px}
    .wrap[hidden]{display:none}

    /* ---------- 머리말 ---------- */
    header{margin-bottom:16px; display:inline-block; cursor:pointer}
    header:hover h1{color:var(--accent)}
    header:focus-visible{outline:1px solid var(--accent); outline-offset:6px}
    header h1{transition:color .15s}
    h1{
      font-family:var(--font-title); font-weight:400; font-size:1.85rem;
      line-height:1.05; letter-spacing:-.015em; margin:0 0 4px;
      text-wrap:balance;
    }
    .sub{
      margin:0; color:var(--ink-3); font-size:.8rem; font-style:italic;
      letter-spacing:.02em;
    }

    .layout{display:grid; grid-template-columns:minmax(0,1fr); gap:26px; align-items:start}
    .layout > *{min-width:0}
    @media (min-width:900px){
      .layout{grid-template-columns:196px minmax(0,1fr)}
    }

    /* ---------- 달력 ---------- */
    @media (min-width:900px){ .cal-col{position:sticky; top:18px} }
    .cal-head{display:flex; align-items:center; gap:4px; margin-bottom:14px}
    .cal-head .ym{
      flex:1; font-size:.78rem; font-weight:600; letter-spacing:.04em;
      color:var(--ink-2); font-variant-numeric:tabular-nums;
    }
    .nav{
      background:none; border:none; color:var(--ink-3);
      width:22px; height:22px; font-size:.95rem; line-height:1;
      cursor:pointer; flex:none; padding:0; border-radius:4px;
    }
    .nav:hover{color:var(--ink); background:var(--sunken)}

    /* 맨 앞 한 칸은 주간 복습 버튼 자리 */
    .grid{display:grid; grid-template-columns:19px repeat(7,minmax(0,1fr));
          gap:1px; min-width:0}
    .wk{
      height:27px; padding:0; border:none; background:none; border-radius:4px;
      color:var(--ink-3); font-size:.66rem; line-height:1; cursor:pointer;
    }
    .wk:hover:not(.none){color:var(--accent); background:var(--sunken)}
    .wk.none{opacity:.22; cursor:default}
    .wk.done{color:var(--ok)}
    .cell.blank{visibility:hidden; cursor:default}
    .dow{
      text-align:center; font-size:.6rem; font-weight:600; color:var(--ink-3);
      padding:0 0 7px; min-width:0; letter-spacing:.04em;
    }
    #cal-grid{grid-auto-rows:27px}
    .cell{
      height:27px; min-width:0; padding:0; position:relative;
      border:none; background:none; color:var(--ink-3); cursor:pointer;
      font-size:.74rem; font-variant-numeric:tabular-nums; border-radius:4px;
      display:flex; align-items:center; justify-content:center;
    }
    .cell.has{color:var(--ink-2); font-weight:500}
    .cell:hover{background:var(--sunken); color:var(--ink)}
    /* 문장이 있는 날은 밑줄 한 획으로만 표시합니다. */
    .cell.has::after{
      content:""; position:absolute; bottom:3px; left:50%; margin-left:-5px;
      width:10px; height:1px; background:var(--accent); opacity:.55;
    }
    .cell.today{color:var(--ink); font-weight:600}
    .cell.on{background:var(--ink); color:var(--ground); font-weight:600}
    .cell.on::after{background:var(--ground); opacity:.7}

    /* 자물쇠 화면 */
    .gate{
      position:fixed; inset:0; z-index:60; background:var(--ground);
      display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .gate[hidden]{display:none}
    .gate-box{width:100%; max-width:320px; text-align:left}
    .gate-box h1{
      font-family:var(--font-title); font-weight:400;
      font-size:clamp(1.7rem, 4vw, 2.2rem); line-height:1.1; margin:0 0 6px;
    }
    .gate-sub{margin:0 0 22px; font-size:.84rem; color:var(--ink-3)}
    .gate-box input{
      width:100%; padding:12px 14px; margin-bottom:14px;
      font-family:var(--font-ui); font-size:1.1rem; letter-spacing:.3em;
      color:var(--ink); background:var(--paper);
      border:1px solid var(--line); border-radius:6px;
    }
    .gate-box input:focus{outline:none; border-color:var(--accent)}
    .gate-box .btn-go{width:100%; justify-content:center}
    .gate-msg{margin:12px 0 0; font-size:.8rem; color:var(--bad); min-height:1.2em}

    .scopes{
      margin-top:20px; padding-top:16px; border-top:1px solid var(--line);
      display:flex; flex-direction:column; align-items:flex-start; gap:2px;
    }
    .scopes button{
      background:none; border:none; padding:3px 0; cursor:pointer;
      color:var(--ink-3); font-size:.8rem; text-align:left;
    }
    .scopes[hidden]{display:none}
    .scopes button:hover{color:var(--ink)}
    .scopes button.on{color:var(--ink); font-weight:600}
    .scopes button.on::before{content:"— "; color:var(--accent)}
    .tally{margin-top:16px; font-size:.72rem; color:var(--ink-3);
           font-variant-numeric:tabular-nums; letter-spacing:.02em}

    /* ---------- 노트 ---------- */
    .notes{margin-top:26px}
    .notes[hidden]{display:none}
    .note-head{
      display:flex; align-items:baseline; gap:8px;
      padding-bottom:7px; border-bottom:1px solid var(--line); margin-bottom:12px;
    }
    .note-head h3{
      margin:0; font-size:.8rem; font-weight:600; letter-spacing:.04em; color:var(--ink);
    }
    .note-head .day{font-size:.74rem; color:var(--ink-3);
                    font-variant-numeric:tabular-nums}
    .note-head .grow{flex:1}
    li.note-sep{
      border:none; padding:18px 0 4px; font-size:.66rem; font-weight:600;
      letter-spacing:.09em; color:var(--ink-3); text-transform:uppercase;
    }
    .note-head .n{font-size:.72rem; color:var(--ink-3);
                  font-variant-numeric:tabular-nums}

    /* 표에 바로 써 내려갑니다 */

    .note-grid{
      border:1px solid var(--line); border-radius:6px; overflow:hidden;
      background:var(--panel);
    }
    .nrow{display:grid; grid-template-columns:62px minmax(0,1fr) minmax(0,1fr);
          border-bottom:1px solid var(--line-soft)}
    .nrow:last-child{border-bottom:none}
    .nrow.head span{
      padding:6px 9px; font-size:.63rem; font-weight:600; letter-spacing:.09em;
      color:var(--ink-3); text-transform:uppercase; background:var(--sunken);
    }
    .nrow.head span{border-right:1px solid var(--line-soft)}
    .nrow.head span:last-child{border-right:none}

    /* 줄 손잡이 — 번호, 그리고 마우스를 올리면 넣기·빼기 */
    .nh{
      display:flex; align-items:center; gap:2px; padding:0 4px 0 7px;
      background:var(--sunken); border-right:1px solid var(--line-soft);
    }
    .nh .rn{
      flex:1; font-size:.68rem; font-weight:400; color:var(--ink-3);
      font-variant-numeric:tabular-nums;
    }
    .nh .rb{
      opacity:0; width:17px; height:17px; padding:0; border-radius:4px;
      font-size:.8rem; line-height:1; color:var(--ink-3); background:transparent;
    }
    .nrow:hover .nh .rb{opacity:1}
    .nh .rb:hover{background:var(--line); color:var(--ink)}
    .nrow input{
      width:100%; min-width:0; font:inherit; font-size:.85rem; color:var(--ink);
      border:none; border-radius:0; background:transparent;
      padding:7px 9px; line-height:1.45;
    }
    .nrow input:first-child{border-right:1px solid var(--line-soft)}
    .nrow input:focus{outline:none; background:var(--sunken)}
    .nrow input.sel{background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent)}
    /* 고른 칸을 담아두는 자리. 안 보이지만 여기에 커서가 갑니다. */
    .nclip{
      position:fixed; top:0; left:0; width:1px; height:1px;
      opacity:0; z-index:-1; border:none; padding:0; resize:none;
    }
    .nrow input.nko{font-family:var(--font-say)}

    .note-save{display:flex; align-items:center; gap:12px; margin-top:12px; flex-wrap:wrap}
    .note-save .tip{font-size:.7rem; color:var(--ink-3)}
    .note-save .grow{flex:1}
    .note-save .state{font-size:.74rem; color:var(--ink-3)}
    .note-save .state.dirty{color:var(--mid)}
    .note-save .state.saved{color:var(--ok)}
    /* ---------- 모드 탭 ---------- */
    .modes{display:flex; gap:22px; margin-bottom:12px}
    .mode{
      background:none; border:none; padding:0 0 9px; cursor:pointer;
      font-size:.92rem; color:var(--ink-3); font-weight:500;
      border-bottom:2px solid transparent; border-radius:0;
    }
    .mode:hover{color:var(--ink-2)}
    .mode.on{color:var(--ink); font-weight:600; border-bottom-color:var(--ink)}
    #quiz-panel[hidden], #diary-panel[hidden]{display:none}

    /* ---------- 영어 일기 ---------- */
    .diary-head{
      display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
      padding-bottom:12px; border-bottom:1px solid var(--ink);
    }
    .diary-head h2{
      margin:0; font-family:var(--font-title); font-weight:400;
      font-size:1.5rem; letter-spacing:-.01em;
      font-variant-numeric:tabular-nums;
    }
    .diary-head .dw{font-size:.76rem; color:var(--ink-3)}
    .diary-head .grow{flex:1}
    .diary-head .count{font-size:.74rem; color:var(--ink-3);
                       font-variant-numeric:tabular-nums; letter-spacing:.03em}

    .diary-body{padding-top:22px}
    /* 세 칸을 나란히, 크기도 똑같이 */
    .dgrid{display:flex; flex-direction:column; gap:18px}
    .dcell{display:flex; flex-direction:column; min-width:0}
    .dcell textarea{
      width:100%; height:190px; resize:vertical;
      font-size:.88rem; line-height:1.7; font-family:var(--font-ui);
    }
    .dcell.ko textarea{font-family:var(--font-say); font-size:.9rem}
    .dhead{display:flex; align-items:baseline; gap:10px; margin-bottom:7px}
    .dhead .grow{flex:1}
    .dhead .state{font-size:.72rem; color:var(--ink-3)}
    .dhead .state.dirty{color:var(--mid)}
    .dhead .state.saved{color:var(--ok)}
    .dlabel{
      margin:0 0 7px; font-size:.66rem; font-weight:600;
      letter-spacing:.09em; color:var(--ink-3); text-transform:uppercase;
    }
    .dhead .dlabel{margin:0}
    .dsave{
      display:flex; align-items:center; gap:18px; flex-wrap:wrap;
      margin-top:20px; padding-top:18px; border-top:1px solid var(--line);
    }
    .dsave .grow{flex:1}
    .dsave .state{font-size:.76rem; color:var(--ink-3)}
    .dsave .state.dirty{color:var(--mid)}
    .dsave .state.saved{color:var(--ok)}

    /* ---------- 테스트 머리 ---------- */
    .quiz-head{
      display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
      padding-bottom:9px; border-bottom:1px solid var(--ink);
      font-size:.74rem; color:var(--ink-3);
      font-variant-numeric:tabular-nums; letter-spacing:.03em;
    }
    .quiz-head .where{
      color:var(--ink); font-weight:600; font-size:.8rem; letter-spacing:.01em;
    }
    .quiz-head .grow{flex:1}
    .score b{color:var(--ok); font-weight:600}
    .score i{font-style:normal; color:var(--bad)}
    .bar{height:1px; background:var(--line)}
    .bar > div{height:100%; background:var(--accent); transition:width .25s}

    .msg{margin:0; padding:14px 0 0; font-size:.8rem; min-height:1em}
    .msg:empty{padding:0}
    .msg.err{color:var(--bad)}
    .msg.ok{color:var(--ok)}

    /* ---------- 문제 ---------- */
    .stage{padding:0}
    ul.qlist{list-style:none; margin:0; padding:0}
    li.q{
      display:grid; grid-template-columns:30px minmax(0,1fr);
      padding:12px 0; border-bottom:1px solid var(--line-soft);
    }
    li.q > *{grid-column:2}
    /* 문제 번호 자리의 체크박스 */
    .pick{display:inline-flex; align-items:center; gap:5px; cursor:pointer; user-select:none}
    .pick input{position:absolute; opacity:0; width:0; height:0}
    .pick .box{
      width:13px; height:13px; flex:none; border-radius:3px;
      border:1px solid var(--line); background:var(--panel); position:relative;
    }
    .pick:hover .box{border-color:var(--ink-3)}
    .pick input:checked + .box{background:var(--ink); border-color:var(--ink)}
    .pick input:checked + .box::after{
      content:""; position:absolute; left:4px; top:1px;
      width:4px; height:8px; border:solid var(--ground);
      border-width:0 1.5px 1.5px 0; transform:rotate(42deg);
    }
    .pick input:focus-visible + .box{outline:1px solid var(--accent); outline-offset:2px}
    .pick .num{font-size:.7rem}
    .page-acts .note.dirty{color:var(--mid)}
    .page-acts .note.saved{color:var(--ok)}

    .qn{
      grid-column:1; grid-row:1; align-self:start; padding-top:3px;
      font-size:.7rem; font-weight:600; color:var(--ink-3);
      font-variant-numeric:tabular-nums; letter-spacing:.04em;
    }
    li.q.done .qn{color:var(--accent)}
    .qtop{display:flex; align-items:flex-start; gap:14px}
    .qtop .qko{flex:1; min-width:0}
    .qsave{
      flex:none; margin-top:2px; padding:2px 0; font-size:.73rem;
      color:var(--ink-3); border-bottom:1px solid transparent;
    }
    .qsave:hover:not(:disabled){color:var(--ink); border-bottom-color:var(--line)}
    .qsave.done{color:var(--ok)}
    .qsave.hist{margin-right:4px}
    .hist-box{
      margin-top:9px; padding:3px 0 3px 12px;
      border-left:2px solid var(--line); font-size:.8rem;
    }
    .hist-box.quiet{color:var(--ink-3)}
    .hrow{display:flex; gap:12px; padding:2px 0; align-items:baseline}
    .hrow .hd{
      flex:none; width:42px; color:var(--ink-3); font-size:.72rem;
      font-variant-numeric:tabular-nums;
    }
    .hrow .hm{flex:1; color:var(--ink-2); word-break:break-word}
    .qko{
      font-family:var(--font-say); font-size:1.11rem; line-height:1.45;
      letter-spacing:-.003em; word-break:keep-all; margin:0; color:var(--ink);
    }
    .qnote{
      font-size:.76rem; color:var(--ink-2); margin:6px 0 0;
      padding:1px 0 1px 12px; border-left:2px solid var(--line); line-height:1.55;
    }

    textarea{
      display:block; width:100%; font:inherit; font-family:var(--font-ui);
      font-size:1rem; line-height:1.6; color:var(--ink);
      background:var(--panel); border:1px solid var(--line); border-radius:6px;
      padding:9px 12px; resize:vertical; min-height:46px;
      transition:border-color .15s;
    }
    textarea:focus{outline:none; border-color:var(--accent)}
    textarea[readonly]{background:var(--sunken); color:var(--ink-2)}
    ::placeholder{color:var(--ink-3)}
    .ans{margin-top:8px}

    .acts{display:flex; align-items:center; gap:16px; margin-top:7px}
    .acts .grow{flex:1}

    button{font:inherit; font-family:var(--font-ui); cursor:pointer;
           border:none; background:none; border-radius:6px}
    button:disabled{opacity:.4; cursor:default}
    button:focus-visible{outline:1px solid var(--accent); outline-offset:3px}

    /* 본 동작 하나만 채웁니다. 나머지는 글자 버튼으로. */
    .btn-go{
      background:var(--ink); color:var(--ground); padding:11px 24px;
      font-size:.86rem; font-weight:600; letter-spacing:.01em;
    }
    .btn-go:hover:not(:disabled){background:var(--accent)}
    .btn-text{
      color:var(--ink-3); font-size:.8rem; padding:2px 0;
      border-bottom:1px solid transparent;
    }
    .btn-text:hover:not(:disabled){color:var(--ink); border-bottom-color:var(--line)}
    .btn-text.lead{color:var(--accent)}
    .btn-text.lead:hover:not(:disabled){border-bottom-color:var(--accent)}

    /* 힌트 — 색 블록 대신 왼쪽 획 하나 */
    .hintbox{
      margin-top:10px; padding:1px 0 1px 12px;
      border-left:2px solid var(--mid); color:var(--ink-2);
      font-size:.85rem; line-height:1.55;
    }
    .hintbox .tag{
      display:block; font-size:.62rem; font-weight:600; letter-spacing:.09em;
      color:var(--mid); text-transform:uppercase; margin-bottom:3px;
    }

    /* 답을 펼쳤을 때 고르는 두 버튼 */
    .btn-go.sm{padding:9px 20px; font-size:.82rem}
    .btn-mid{
      padding:9px 18px; font-size:.82rem; font-weight:600;
      color:var(--ink); background:var(--sunken);
      box-shadow:inset 0 0 0 1px var(--line);
    }
    .btn-mid:hover:not(:disabled){background:var(--line)}

    /* 문장 옆에 붙는 지금 상태 */
    .qtop .tag{
      flex:0 0 auto; margin-left:2px;
      font-size:.62rem; font-weight:600; letter-spacing:.06em;
      padding:2px 7px; border-radius:99px; white-space:nowrap;
      color:var(--ink-3); background:var(--sunken);
    }
    .qtop .tag.ok{color:var(--ok); box-shadow:inset 0 0 0 1px var(--ok)}
    .qtop .tag.rv{color:var(--mid); box-shadow:inset 0 0 0 1px var(--mid)}
    .qsave.undo{margin-left:6px; font-size:.7rem}
    li.q.done .qko{color:var(--ink-2)}

    /* 5문제를 스크롤하며 풀어도 채점 버튼은 늘 화면에 붙어 있습니다. */
    .page-acts{
      position:sticky; bottom:0; z-index:5;
      display:flex; align-items:center; gap:20px; flex-wrap:wrap;
      margin-top:6px; padding:13px 0 15px;
      border-top:1px solid var(--ink); background:var(--ground);
    }
    .page-acts::before{
      content:""; position:absolute; left:0; right:0; top:-22px; height:22px;
      background:linear-gradient(to bottom, transparent, var(--ground));
      pointer-events:none;
    }
    .page-acts .grow{flex:1}
    .page-acts .note{font-size:.76rem; color:var(--ink-3);
                     font-variant-numeric:tabular-nums}

    .done-panel{padding:64px 0; text-align:left}
    .done-panel .big{
      font-family:var(--font-title); font-size:2rem; margin-bottom:8px;
      letter-spacing:-.01em;
    }
    .done-panel .line{
      color:var(--ink-3); font-size:.84rem; margin-bottom:26px;
      font-variant-numeric:tabular-nums; letter-spacing:.02em;
    }
    .blank{padding:64px 0; color:var(--ink-3); font-size:.86rem}
    .blank strong{
      display:block; font-family:var(--font-title); font-weight:400;
      color:var(--ink-2); font-size:1.5rem; margin-bottom:8px;
    }

    /* ---------- 주간 복습 팝업 ---------- */
    #modal{
      position:fixed; inset:0; z-index:50; display:flex;
      align-items:center; justify-content:center; padding:24px;
      background:rgba(22,23,26,.44);
    }
    #modal[hidden]{display:none}
    .sheet{
      width:100%; max-width:560px; background:var(--ground);
      border:1px solid var(--line); border-radius:10px;
      box-shadow:0 18px 50px rgba(0,0,0,.22); overflow:hidden;
    }
    .sheet-head{
      display:flex; align-items:center; gap:10px;
      padding:14px 18px; border-bottom:1px solid var(--ink);
      font-size:.78rem; color:var(--ink-3);
    }
    .sheet-head b{color:var(--ink); font-size:.86rem; letter-spacing:.01em}
    .sheet-head .wl{margin-left:8px; font-variant-numeric:tabular-nums}
    .sheet-head .grow{flex:1}
    .sheet-head .cnt{font-variant-numeric:tabular-nums}
    .sheet-head .x{
      color:var(--ink-3); font-size:1.2rem; line-height:1; padding:0 2px;
    }
    .sheet-head .x:hover{color:var(--ink)}

    .sheet-body{padding:26px 18px 18px}
    .rq{
      font-family:var(--font-say); font-size:1.3rem; line-height:1.5;
      margin:0 0 4px; word-break:keep-all; text-wrap:balance;
    }
    .rn{font-size:.74rem; color:var(--ink-3); margin:0 0 14px}
    .rq + textarea{margin-top:14px}
    .rans{
      margin-top:14px; padding:2px 0 2px 12px; border-left:2px solid var(--ok);
      font-size:.98rem; color:var(--ink);
    }
    .rans b{
      display:block; font-size:.62rem; font-weight:600; letter-spacing:.09em;
      color:var(--ink-3); text-transform:uppercase; margin-bottom:3px;
    }
    .rans .rh{display:flex; align-items:baseline; gap:12px; margin-bottom:3px}
    .rans .rh b{margin-bottom:0}
    .rans .rh .btn-text{font-size:.7rem}
    .sheet-acts{display:flex; align-items:center; gap:16px; margin-top:16px; flex-wrap:wrap}
    .sheet-acts .grow{flex:1}
    .sheet-acts .cnt{font-size:.74rem; color:var(--ink-3);
                     font-variant-numeric:tabular-nums}
    .sheet-body.done{text-align:left; padding:34px 18px 22px}
    .sheet-body.done .big{
      font-family:var(--font-title); font-size:2.4rem; line-height:1;
      margin-bottom:8px; font-variant-numeric:tabular-nums;
    }
    .sheet-body.done .line{color:var(--ink-2); font-size:.86rem;
                           font-variant-numeric:tabular-nums}
    .sheet-body.done .prev{margin-top:6px; font-size:.76rem; color:var(--ink-3)}

    footer{
      margin-top:44px; padding-top:18px; border-top:1px solid var(--line);
      display:flex; align-items:center; gap:18px; flex-wrap:wrap;
      font-size:.74rem; color:var(--ink-3); letter-spacing:.02em;
    }
    footer .grow{flex:1}
    footer .ai-on{color:var(--ok); font-weight:600}
    .mini{
      background:none; border:none; color:var(--ink-3); padding:2px 0;
      font-size:.74rem; cursor:pointer; border-bottom:1px solid transparent;
    }
    .mini:hover{color:var(--ink); border-bottom-color:var(--line)}

    /* ---------- 손전화 ---------- */
    @media (max-width:640px){
      .wrap{padding:16px 14px 80px}
      header h1{font-size:clamp(1.6rem, 8vw, 2.2rem)}
      .layout{gap:20px}
      /* 달력은 접어두고, 문제부터 보이게 */
      .cal-col{order:2}
      .layout > section{order:1}
      .grid{grid-template-columns:22px repeat(7,minmax(0,1fr))}
      #cal-grid{grid-auto-rows:32px}
      .cell, .wk{height:32px}
      .cell{font-size:.8rem}
      .scopes{flex-direction:row; flex-wrap:wrap; gap:6px 16px}
      .qko{font-size:1.05rem}
      .qtop{flex-wrap:wrap; gap:8px}
      .acts{flex-wrap:wrap; gap:12px}
      .page-acts{gap:12px; padding:11px 0 13px}
      .page-acts .note{width:100%; order:9}
      /* 노트 표: 줄 손잡이를 좁히고 두 칸을 나란히 */
      .nrow{grid-template-columns:38px minmax(0,1fr) minmax(0,1fr)}
      .nh{padding:0 2px 0 4px; gap:0}
      .nh .rn{font-size:.62rem}
      .nh .rb{width:15px; height:15px; font-size:.72rem}
      .nrow input{font-size:.8rem; padding:8px 6px}
      .note-save .tip{width:100%; order:9}
      .dcell textarea{height:150px}
      #modal{padding:12px}
      .sheet{max-height:88vh; overflow-y:auto}
    }
    /* 손가락으로 쓰는 화면에는 마우스를 올릴 수가 없습니다 */
    @media (hover:none){
      .nh .rb{opacity:1}
    }

    @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
  </style>
</head>
<body>
  <div class="gate" id="gate" hidden>
    <form class="gate-box" id="gate-form">
      <h1>Honor your daily promise</h1>
      <p class="gate-sub">비밀번호를 넣어주세요.</p>
      <input id="gate-pw" type="password" inputmode="numeric"
             autocomplete="current-password" placeholder="● ● ● ● ● ●">
      <button class="btn-go" id="gate-go" type="submit">들어가기</button>
      <p class="gate-msg" id="gate-msg"></p>
    </form>
  </div>

  <div class="wrap" id="wrap" hidden>
    <header id="home" role="button" tabindex="0" title="처음으로">
      <h1>Honor your daily promise</h1>
      <p class="sub">Remember the US business trip, Yeeun.</p>
    </header>

    <div class="layout" id="layout">
      <div class="cal-col">
        <section class="box cal">
          <div class="cal-head">
            <button class="nav" id="prev" title="지난 달">‹</button>
            <span class="ym" id="ym">—</span>
            <button class="nav" id="next" title="다음 달">›</button>
          </div>
          <div class="grid" id="dow-row"></div>
          <div class="grid" id="cal-grid"></div>
          <div class="scopes" id="scopes">
            <button data-scope="all">전체</button>
            <button data-scope="today">오늘</button>
            <button data-scope="week">최근 7일</button>
            <button data-scope="review">복습 필요</button>
            <button data-scope="done">암기 완료</button>
          </div>
          <div class="tally" id="tally">—</div>
        </section>
      </div>

      <section>
        <div class="modes" role="tablist">
          <button class="mode on" id="mode-quiz">테스트</button>

        <div id="quiz-panel">

          </div>

    </div>

    <footer>
      <span id="ai-state">—</span>
      <button class="mini" id="ai-test">AI 연결 확인</button>
      <span class="grow"></span>
